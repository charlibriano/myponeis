<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bolhas da Pônei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BOLHAS DA PÔNEI

   GRADE HEXAGONAL. As fileiras são deslocadas meia bolha, como nos
   jogos do gênero. A versão anterior era uma grade retangular, que
   parece planilha e desperdiça a mira diagonal: em hexágono cada
   bolha toca seis vizinhas, então ângulo importa de verdade.

   A MIRA MOSTRA O CAMINHO. Ela arrasta o dedo, uma trilha de
   pontinhos desenha o trajeto — rebote na parede incluído — até o
   círculo pontilhado na casa exata onde a bola vai grudar. Solta o
   dedo e a bola percorre esse mesmo caminho. É a trilha que torna
   mirar em ângulo possível aos 4 anos.

   NÃO EXISTE PERDER. Sem relógio, sem teto descendo, sem tela de
   derrota. O tabuleiro só encolhe, e ela sai quando limpar tudo.

   Tudo aqui é forma de CSS. A única figura é a foto da pônei, da
   pasta imagens/.
   ============================================================ */
:root{ --roxo:#6B3FBF; --rosa:#FF6FB0; --amarelo:#FFD34A; }
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  font-family:'Baloo 2','Segoe UI Rounded',system-ui,sans-serif;
  color:#40276E; user-select:none; overflow:hidden; touch-action:manipulation;
}
#app{
  height:100dvh; display:flex; flex-direction:column;
  padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));
  max-width:560px; margin:0 auto;
}
.hud{ display:flex; align-items:center; gap:8px; min-height:44px; }
.btn-icone{
  width:44px; height:44px; border:0; border-radius:999px;
  background:rgba(255,255,255,.78); font-size:20px; cursor:pointer;
  box-shadow:0 2px 0 rgba(62,42,92,.12);
}
.balao{
  margin-left:auto; background:#fff; border-radius:20px; padding:8px 15px;
  font-weight:800; font-size:clamp(14px,4.4vw,19px);
  box-shadow:0 4px 0 rgba(62,42,92,.10);
}
.balao b{ color:#D2439A; }
.versao{ font-size:10px; font-weight:600; color:#B0A0CC; margin-left:6px; }

#recado{
  margin-top:8px; padding:10px 13px; border-radius:14px;
  background:#3B1220; color:#FFE6EE; border:2px solid var(--rosa);
  font-size:12.5px; line-height:1.5; cursor:pointer; word-break:break-word;
}
#recado.escondida{ display:none; }

#campo{
  position:relative; flex:1; min-height:0; margin-top:8px;
  border-radius:22px; overflow:hidden;
  background:linear-gradient(180deg,#CFEEFF 0%,#E4F6FF 55%,#DFF3E6 100%);
  box-shadow:inset 0 2px 10px rgba(74,42,135,.14);
  cursor:pointer;
}
/* a tremida curta do estouro: dá peso ao acerto sem enjoar */
#campo.treme{ animation:tremeCampo .22s ease-in-out 2; }
@keyframes tremeCampo{
  0%,100%{ transform:translate(0,0); }
  25%    { transform:translate(-3px,1px); }
  75%    { transform:translate(3px,-1px); }
}

.bolha{
  position:absolute; border-radius:50%;
  box-shadow:inset -3px -4px 8px rgba(0,0,0,.16), inset 3px 4px 8px rgba(255,255,255,.75),
             0 2px 5px rgba(40,60,90,.22);
}
.bolha::after{
  content:""; position:absolute; left:22%; top:18%;
  width:26%; height:22%; border-radius:50%;
  background:rgba(255,255,255,.85);
}
.bolha.nasceu{ animation:assenta .32s cubic-bezier(.2,1.7,.4,1); }
@keyframes assenta{
  0%  { transform:scale(1.3); }
  55% { transform:scale(.88); }
  100%{ transform:scale(1); }
}
.bolha.estoura{ animation:puf .34s ease-out forwards; }
@keyframes puf{
  0%  { transform:scale(1);    opacity:1; }
  40% { transform:scale(1.45); opacity:.95; }
  100%{ transform:scale(.15);  opacity:0; }
}

/* respingo do estouro: gotinhas voando para fora */
.respingo{
  position:absolute; border-radius:50%; pointer-events:none;
  background:rgba(255,255,255,.9);
  animation:espirra .5s ease-out forwards;
}
@keyframes espirra{
  0%  { transform:translate(0,0) scale(1);  opacity:.95; }
  100%{ transform:translate(var(--rx), var(--ry)) scale(.2); opacity:0; }
}

/* a trilha de mira */
/* a trilha precisa ser LIDA, não adivinhada: pontinho branco sobre
   céu claro somia. Agora é maior, com anel escuro em volta, então
   aparece tanto no azul do céu quanto sobre as bolhas. */
.ponto{
  position:absolute; width:11px; height:11px; margin:-5.5px 0 0 -5.5px;
  border-radius:50%; background:#fff;
  border:2px solid rgba(70,45,120,.55);
  box-shadow:0 0 8px rgba(255,255,255,.9);
  pointer-events:none;
}
#alvo{
  position:absolute; border-radius:50%; pointer-events:none;
  border:4px dashed #6B3FBF;
  background:rgba(255,255,255,.28);
  box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 0 16px rgba(107,63,191,.6);
  opacity:0; transition:opacity .12s ease;
  animation:alvoGira 3s linear infinite;
}
@keyframes alvoGira{ to{ transform:rotate(360deg); } }
#alvo.on{ opacity:1; }

/* o canhão fica dentro do campo: a mira precisa começar exatamente
   no ponto de onde a bola sai */
#canhao{
  position:absolute; border-radius:50%; pointer-events:none;
  box-shadow:inset -3px -4px 8px rgba(0,0,0,.16), inset 3px 4px 8px rgba(255,255,255,.75),
             0 3px 8px rgba(40,60,90,.3);
  transition:transform .12s ease;
}
#canhao::after{
  content:""; position:absolute; left:22%; top:18%;
  width:26%; height:22%; border-radius:50%; background:rgba(255,255,255,.85);
}
#canhao.recuou{ transform:scale(.8); }

/* o número da sequência, saltando do ponto do estouro */
.combo{
  position:absolute; pointer-events:none; z-index:9;
  font-family:inherit; font-weight:800; color:#fff;
  text-shadow:0 2px 0 #E3488F, 0 0 12px rgba(255,255,255,.9);
  animation:comboSobe 1s ease-out forwards;
}
@keyframes comboSobe{
  0%  { transform:translate(-50%,-50%) scale(.4); opacity:0; }
  25% { transform:translate(-50%,-50%) scale(1.25); opacity:1; }
  100%{ transform:translate(-50%,-160%) scale(1); opacity:0; }
}

/* ---------- a pônei presa ----------
   Não combina com cor nenhuma: para soltá-la é preciso estourar o
   que a segura até a gaiola perder a ligação com o teto. É o
   objetivo da fase, e o motivo pelo qual vale mirar com cuidado. */
.bolha.presa{
  background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.95), rgba(200,225,255,.55)) !important;
  border:3px solid #FFD34A;
  box-shadow:0 0 0 2px rgba(107,63,191,.5), 0 0 14px rgba(255,211,74,.85);
  overflow:hidden;
  animation:presaPede 2.2s ease-in-out infinite;
}
.bolha.presa::after{ display:none; }
.bolha.presa img{
  width:100%; height:100%; border-radius:50%;
  object-fit:cover; object-position:center 28%;
  opacity:.92;
}
@keyframes presaPede{
  0%,100%{ box-shadow:0 0 0 2px rgba(107,63,191,.5), 0 0 12px rgba(255,211,74,.7); }
  50%    { box-shadow:0 0 0 3px rgba(107,63,191,.6), 0 0 22px rgba(255,211,74,1); }
}
/* a subida da resgatada até o colo da lançadora */
.bolha.salva{ animation:sobeSalva 1.1s ease-in forwards; z-index:12; }
@keyframes sobeSalva{
  0%  { transform:scale(1)   translateY(0); opacity:1; }
  35% { transform:scale(1.5) translateY(-18px); opacity:1; }
  100%{ transform:scale(.5)  translateY(320px); opacity:0; }
}

/* ---------- placar ---------- */
#placar{
  display:flex; justify-content:center; gap:10px; margin-top:6px;
}
#placar div{
  background:rgba(255,255,255,.8); border-radius:14px;
  padding:5px 13px; text-align:center;
  box-shadow:0 2px 0 rgba(62,42,92,.12);
}
#placar b{ display:block; font-size:18px; color:var(--roxo); line-height:1; }
#placar small{ font-size:10px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color:#9A83C4; }

/* ---------- a próxima bolha, tocável ---------- */
#trocar{
  border:0; padding:0; cursor:pointer; background:none;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
#trocar .bola{
  width:44px; height:44px; border-radius:50%;
  box-shadow:inset -3px -4px 8px rgba(0,0,0,.16), inset 3px 4px 8px rgba(255,255,255,.75),
             0 3px 8px rgba(40,60,90,.28);
  position:relative;
}
#trocar .bola::after{
  content:""; position:absolute; left:22%; top:18%;
  width:26%; height:22%; border-radius:50%; background:rgba(255,255,255,.85);
}
#trocar small{ font-size:10px; font-weight:800; color:#8A6FBF; }
#trocar:active .bola{ transform:scale(.9); }
#trocar.girou .bola{ animation:trocou .4s ease; }
@keyframes trocou{
  0%{ transform:rotate(0) scale(1); }
  50%{ transform:rotate(180deg) scale(1.2); }
  100%{ transform:rotate(360deg) scale(1); }
}

#lancador{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  gap:12px; margin-top:8px; min-height:88px;
}
#poneiCaixa{
  width:88px; height:88px; border-radius:50%; overflow:hidden;
  border:4px solid #fff; background:#fff;
  box-shadow:0 0 0 3px var(--rosa), 0 6px 14px rgba(62,42,92,.3);
}
#poneiCaixa img{ width:100%; height:100%; object-fit:cover; object-position:center 30%; }
#poneiCaixa.atira{ animation:empurra .3s ease-out; }
@keyframes empurra{
  0%{ transform:translateY(0) scale(1); }
  40%{ transform:translateY(-9px) scale(1.07); }
  100%{ transform:translateY(0) scale(1); }
}
/* comemoração de jogada grande: a pônei entra na festa */
#poneiCaixa.festeja{ animation:festeja .8s ease-in-out 2; }
@keyframes festeja{
  0%,100%{ transform:rotate(0) scale(1); }
  25%    { transform:rotate(-11deg) scale(1.12); }
  75%    { transform:rotate(11deg)  scale(1.12); }
}
#quantas{ font-size:15px; font-weight:800; color:#8A6FBF; }

#nivel{
  position:fixed; inset:0; z-index:150; display:flex;
  align-items:center; justify-content:center; flex-direction:column; gap:16px;
  padding:24px; text-align:center;
  background:radial-gradient(circle at 50% 38%, #FFF9DC 0%, #E9F7FF 55%, #EFE0FF 100%);
}
#nivel.escondida{ display:none; }
#nivel h2{ font-size:clamp(24px,7vw,34px); color:var(--roxo); text-shadow:0 3px 0 #fff; }
#nivel .opcoes{ display:flex; flex-direction:column; gap:12px; width:min(86vw,320px); }
#nivel button{
  display:flex; align-items:center; gap:14px;
  border:0; cursor:pointer; font-family:inherit; text-align:left;
  padding:12px 16px; border-radius:20px; background:#fff;
  box-shadow:0 5px 0 #D9C6F2, 0 8px 16px rgba(107,63,191,.16);
}
#nivel button:active{ transform:translateY(4px); box-shadow:0 1px 0 #D9C6F2; }
#nivel .amostra{ display:flex; gap:4px; flex:0 0 auto; }
#nivel .amostra i{ width:16px; height:16px; border-radius:50%; display:block; }
#nivel .txt{ font-size:19px; font-weight:800; color:var(--roxo); line-height:1.15; }
#nivel .txt small{ display:block; font-size:13px; font-weight:600; color:#9A83C4; }

#pronto{
  position:fixed; inset:0; z-index:200; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  padding:24px; text-align:center;
  background:radial-gradient(circle at 50% 40%, #FFF9DC 0%, #E9F7FF 55%, #EFE0FF 100%);
}
#pronto.visivel{ display:flex; }
#pronto .moldura{
  width:min(62vw,230px); aspect-ratio:1; border-radius:50%;
  overflow:hidden; border:6px solid var(--amarelo); background:#fff;
  box-shadow:0 12px 34px rgba(107,63,191,.3);
  animation:prontoEntra .6s cubic-bezier(.2,1.5,.4,1) both;
}
#pronto .moldura img{ width:100%; height:100%; object-fit:cover; object-position:center 30%; }
@keyframes prontoEntra{
  0%{ transform:scale(.3) rotate(-16deg); opacity:0; }
  100%{ transform:scale(1) rotate(0); opacity:1; }
}
#pronto .nome{ font-size:clamp(24px,7vw,36px); font-weight:800; color:var(--roxo); text-shadow:0 3px 0 #fff; }
#pronto .sub{ font-size:16px; font-weight:600; color:#8A6FBF; }
</style>

</head>
<body>
<div class="cenario-chao"></div>

<div id="app">
  <div class="hud">
    <button class="btn-icone" id="btnCasa" aria-label="Voltar ao mapa">🏠</button>
    <div class="balao">Bolhas <b id="quem">…</b><span class="versao" id="versao"></span></div>
  </div>

  <div id="recado" class="escondida"></div>

  <div id="campo">
    <div id="trilha"></div>
    <div id="alvo"></div>
    <div id="canhao"></div>
  </div>

  <div id="placar">
    <div><b id="pontos">0</b><small>pontos</small></div>
    <div><b id="salvas">0/3</b><small>resgatadas</small></div>
    <div><b id="quantas">0</b><small>bolhas</small></div>
  </div>

  <div id="lancador">
    <div id="poneiCaixa"><img id="foto" alt=""></div>
    <button id="trocar"><span class="bola"></span><small>trocar</small></button>
  </div>
</div>

<div id="nivel">
  <h2>Escolha o desafio</h2>
  <div class="opcoes" id="opcoesNivel"></div>
</div>

<div id="pronto">
  <div class="moldura" id="prontoFoto"></div>
  <div class="nome" id="prontoNome"></div>
  <div class="sub" id="prontoSub">Resgatou todas as pôneis!</div>
</div>

<script>
(function(){
  var VERSAO = 'v5';

  var PONEIS_BOLHAS = [
    'Rarity', 'Princesa Celestia', 'Princesa Cadance', 'Apple Bloom',
    'Sweetie Belle', 'Scootaloo', 'Trixie', 'Diamond Tiara',
    'Silver Spoon', 'Cheerilee', 'Lyra Heartstrings', 'Octavia Melody',
    'DJ Pon-3', 'Coco Pommel', 'Sunburst', 'Gilda',
    'Big McIntosh', 'Babs Seed', 'Twist', 'Pipsqueak'
  ];

  /* cores bem separadas: aos 4 anos dois tons parecidos de azul são a
     mesma cor, e o jogo vira sorte */
  var CORES = [
    { id:'rosa',    css:'radial-gradient(circle at 34% 30%, #FFB6D9, #F0629F)', tom:'#F0629F' },
    { id:'azul',    css:'radial-gradient(circle at 34% 30%, #A8DEFF, #3F9BE0)', tom:'#3F9BE0' },
    { id:'verde',   css:'radial-gradient(circle at 34% 30%, #B6EFC0, #4FBE6B)', tom:'#4FBE6B' },
    { id:'amarelo', css:'radial-gradient(circle at 34% 30%, #FFEBA8, #F0C03E)', tom:'#F0C03E' },
    { id:'roxo',    css:'radial-gradient(circle at 34% 30%, #D8BDF5, #8B5CE0)', tom:'#8B5CE0' }
  ];

  var NIVEIS = [
    { id:'facil',   cores:3, linhas:4, presas:2, nome:'Fácil'   },
    { id:'medio',   cores:4, linhas:6, presas:3, nome:'Médio'   },
    { id:'dificil', cores:5, linhas:8, presas:4, nome:'Difícil' }
  ];
  var NIVEL_CHAVE = 'poneis.bolhas.nivel';

  /* Grade hexagonal: fileira par tem COLS bolhas, fileira ímpar tem
     uma a menos e começa deslocada meia bolha. A altura de cada
     fileira é 0,87 do diâmetro — é o encaixe que faz o hexágono. */
  var COLS = 9;
  var MAX_LINHAS = 13;
  var ALTURA_FILA = 0.87;

  var $ = function(id){ return document.getElementById(id); };

  function avisa(txt){
    var r = $('recado');
    if(!r) return;
    r.textContent = txt;
    r.classList.remove('escondida');
  }
  $('recado').addEventListener('click', function(){ $('recado').classList.add('escondida'); });
  window.addEventListener('error', function(e){
    avisa('Erro: ' + e.message + (e.lineno ? ' (linha ' + e.lineno + ')' : ''));
  });
  $('versao').textContent = VERSAO;
  $('btnCasa').addEventListener('click', function(){ location.href = 'index.html'; });

  var pool = PONEIS_BOLHAS;
  try{
    if(typeof colecao === 'function'){
      var minhas = colecao().filter(function(n){ return PONEIS_BOLHAS.indexOf(n) >= 0; });
      if(minhas.length >= 3) pool = minhas;
    }
  }catch(e){}
  var ponei = pool[Math.floor(Math.random() * pool.length)];
  var foto  = 'imagens/' + encodeURIComponent(ponei) + '.png';
  $('quem').textContent = ponei;
  $('foto').src = foto;
  $('foto').onerror = function(){ avisa('A imagem de ' + ponei + ' não carregou (' + foto + ').'); };

  /* som próprio: o tom sobe a cada bolha da sequência, que é o que
     transforma uma jogada grande em recompensa */
  var ctxSom = null;
  function tom(freq, dur){
    try{
      ctxSom = ctxSom || new (window.AudioContext || window.webkitAudioContext)();
      var o = ctxSom.createOscillator(), g = ctxSom.createGain();
      o.type = 'triangle'; o.frequency.value = freq;
      var t = ctxSom.currentTime;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.22, t + .015);
      g.gain.exponentialRampToValueAtTime(.0001, t + (dur || .12));
      o.connect(g).connect(ctxSom.destination);
      o.start(t); o.stop(t + (dur || .12) + .02);
    }catch(e){}
  }

  var campo = $('campo');
  var grade = [], paleta = [], proxima = null, depois = null;
  var pontos = 0, salvas = 0, totalPresas = 0;
  var atirando = false, terminado = false, mirando = false;
  var lado = 40, filaH = 35;
  var origem = { x:0, y:0 };

  function larguraDaFila(l){ return (l % 2 === 0) ? COLS : COLS - 1; }
  function posX(l, c){ return c * lado + (l % 2 ? lado / 2 : 0) + lado / 2; }
  function posY(l){ return l * filaH + lado / 2; }

  function medeLado(){
    lado = Math.floor(campo.clientWidth / COLS);
    filaH = lado * ALTURA_FILA;
  }

  function corDe(id){
    for(var i = 0; i < CORES.length; i++) if(CORES[i].id === id) return CORES[i];
    return CORES[0];
  }

  function criaBolha(cor, l, c, nova, presa){
    var d = document.createElement('div');
    d.className = 'bolha' + (nova ? ' nasceu' : '') + (presa ? ' presa' : '');
    d.style.width = d.style.height = (lado - 3) + 'px';
    if(presa) d.innerHTML = '<img src="imagens/' + encodeURIComponent(presa) + '.png" alt="">';
    else d.style.background = corDe(cor).css;
    d.style.left = (posX(l, c) - (lado - 3) / 2) + 'px';
    d.style.top  = (posY(l)    - (lado - 3) / 2) + 'px';
    campo.appendChild(d);
    return d;
  }

  function ajeitaCanhao(){
    origem.x = campo.clientWidth / 2;
    origem.y = campo.clientHeight - lado * 0.6;
    var c = $('canhao');
    c.style.width = c.style.height = (lado - 3) + 'px';
    c.style.left = (origem.x - (lado - 3) / 2) + 'px';
    c.style.top  = (origem.y - (lado - 3) / 2) + 'px';
    var a = $('alvo');
    a.style.width = a.style.height = lado + 'px';
  }

  function monta(nivel){
    terminado = false; atirando = false;
    campo.querySelectorAll('.bolha, .respingo, .combo').forEach(function(b){ b.remove(); });
    medeLado();

    paleta = CORES.slice(0, nivel.cores).map(function(c){ return c.id; });

    grade = [];
    for(var l = 0; l < MAX_LINHAS; l++){
      grade.push([]);
      for(var c = 0; c < larguraDaFila(l); c++) grade[l].push(null);
    }
    for(var li = 0; li < nivel.linhas; li++){
      for(var co = 0; co < larguraDaFila(li); co++){
        var cor = paleta[Math.floor(Math.random() * paleta.length)];
        grade[li][co] = { cor:cor, el:criaBolha(cor, li, co) };
      }
    }

    /* as gaiolas nunca na primeira fileira: presa colada no teto não
       teria como cair, e a fase ficaria sem solução */
    pontos = 0; salvas = 0;
    totalPresas = nivel.presas;
    var candidatas = PONEIS_BOLHAS.filter(function(n){ return n !== ponei; })
                                  .sort(function(){ return Math.random() - .5; });
    var postas = 0, tentativas = 0;
    while(postas < totalPresas && tentativas < 400){
      tentativas++;
      var l = 1 + Math.floor(Math.random() * (nivel.linhas - 1));
      var c = Math.floor(Math.random() * larguraDaFila(l));
      if(!grade[l][c] || grade[l][c].cor === 'presa') continue;
      grade[l][c].el.remove();
      var quem = candidatas[postas];
      grade[l][c] = { cor:'presa', ponei:quem, el:criaBolha(null, l, c, false, quem) };
      postas++;
    }
    totalPresas = postas;

    depois = null;
    ajeitaCanhao();
    sorteiaProxima();
    atualizaPlacar();
    contaBolhas();
  }

  /* só sorteia cor que ainda existe no tabuleiro: entregar uma cor que
     não combina com nada é dar peça inútil na mão dela */
  /* só sorteia cor que ainda existe no tabuleiro: entregar uma cor que
     não combina com nada é dar peça inútil na mão dela. A gaiola não
     entra na conta — ela não combina com nada por definição. */
  function corUtil(){
    var vivas = {};
    for(var l = 0; l < MAX_LINHAS; l++)
      for(var c = 0; c < grade[l].length; c++)
        if(grade[l][c] && grade[l][c].cor !== 'presa') vivas[grade[l][c].cor] = 1;
    var lista = Object.keys(vivas);
    if(!lista.length) lista = paleta;
    return lista[Math.floor(Math.random() * lista.length)];
  }

  function pintaMao(){
    $('canhao').style.background = corDe(proxima).css;
    $('trocar').querySelector('.bola').style.background = corDe(depois).css;
  }

  /* Duas bolhas na mão, e a de trás pode virar a da frente com um
     toque. É o que transforma "a cor que veio" em escolha: sem isso,
     tabuleiro difícil vira sorte. */
  function sorteiaProxima(){
    proxima = depois || corUtil();
    depois = corUtil();
    pintaMao();
  }

  $('trocar').addEventListener('click', function(){
    if(terminado || atirando) return;
    var t = proxima; proxima = depois; depois = t;
    pintaMao();
    var b = $('trocar');
    b.classList.remove('girou');
    void b.offsetWidth;
    b.classList.add('girou');
    tom(660, .08);
  });

  function contaBolhas(){
    var n = 0;
    for(var l = 0; l < MAX_LINHAS; l++)
      for(var c = 0; c < grade[l].length; c++) if(grade[l][c]) n++;
    $('quantas').textContent = n;
    return n;
  }

  function atualizaPlacar(){
    $('pontos').textContent = pontos;
    $('salvas').textContent = salvas + '/' + totalPresas;
  }

  function ganha(n){ pontos += n; atualizaPlacar(); }

  /* ---------- mira ---------- */

  /* Marcha o caminho de 2 em 2 pixels: bate na parede, inverte; entra
     numa casa ocupada, para. A bola gruda na última casa livre pela
     qual passou. */
  function tracar(px, py){
    var W = campo.clientWidth, H = campo.clientHeight, raio = lado / 2;
    var x = origem.x, y = origem.y;
    var dx = px - x, dy = py - y;
    if(dy > -20) dy = -20;                    // nunca mira para baixo
    var m = Math.sqrt(dx * dx + dy * dy) || 1;
    dx /= m; dy /= m;

    var pontos = [{ x:x, y:y }], livre = null, destino = null;

    for(var i = 0; i < 3000; i++){
      x += dx * 2; y += dy * 2;
      if(x < raio){ x = raio; dx = -dx; pontos.push({ x:x, y:y }); }
      else if(x > W - raio){ x = W - raio; dx = -dx; pontos.push({ x:x, y:y }); }

      var cel = casaEm(x, y);
      if(!cel){ if(y > H + lado) break; continue; }

      if(cel.l < 0){ destino = livre; break; }
      if(grade[cel.l][cel.c]){ destino = livre; break; }
      livre = cel;
      if(y > H + lado) break;
    }
    pontos.push({ x:x, y:y });
    if(!destino) destino = livre;
    return { pontos:pontos, destino:destino };
  }

  /* de pixel para casa, respeitando o deslocamento das fileiras ímpares */
  function casaEm(x, y){
    var l = Math.floor(y / filaH);
    if(l < 0) return { l:0, c:0 };
    if(l >= MAX_LINHAS) return null;
    var desl = (l % 2) ? lado / 2 : 0;
    var c = Math.floor((x - desl) / lado);
    if(c < 0) c = 0;
    if(c > larguraDaFila(l) - 1) c = larguraDaFila(l) - 1;
    return { l:l, c:c };
  }

  function mostraMira(px, py){
    var t = tracar(px, py);
    var trilha = $('trilha');
    trilha.innerHTML = '';

    var andado = 0, ultimo = t.pontos[0];
    for(var i = 1; i < t.pontos.length; i++){
      var p = t.pontos[i];
      andado += Math.sqrt(Math.pow(p.x - ultimo.x, 2) + Math.pow(p.y - ultimo.y, 2));
      if(andado >= 15){
        andado = 0;
        var e = document.createElement('div');
        e.className = 'ponto';
        e.style.left = p.x + 'px';
        e.style.top  = p.y + 'px';
        trilha.appendChild(e);
      }
      ultimo = p;
    }

    var a = $('alvo');
    if(t.destino){
      a.classList.add('on');
      a.style.left = (posX(t.destino.l, t.destino.c) - lado / 2) + 'px';
      a.style.top  = (posY(t.destino.l) - lado / 2) + 'px';
    }else a.classList.remove('on');
    return t;
  }

  function limpaMira(){
    $('trilha').innerHTML = '';
    $('alvo').classList.remove('on');
  }

  function ondeToquei(ev){
    var r = campo.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  campo.addEventListener('pointerdown', function(ev){
    if(terminado || atirando) return;
    mirando = true;
    try{ campo.setPointerCapture(ev.pointerId); }catch(e){}
    var p = ondeToquei(ev);
    mostraMira(p.x, p.y);
  });
  campo.addEventListener('pointermove', function(ev){
    if(terminado || atirando || !mirando) return;
    var p = ondeToquei(ev);
    mostraMira(p.x, p.y);
  });
  /* dispara ao SOLTAR: assim ela corrige a mira antes, e a trilha tem
     serventia */
  ['pointerup','pointercancel'].forEach(function(n){
    campo.addEventListener(n, function(ev){
      if(!mirando) return;
      mirando = false;
      if(terminado || atirando){ limpaMira(); return; }
      var t = tracar(ondeToquei(ev).x, ondeToquei(ev).y);
      limpaMira();
      if(t.destino) atira(t);
    });
  });

  function atira(t){
    atirando = true;
    $('poneiCaixa').classList.remove('atira');
    void $('poneiCaixa').offsetWidth;
    $('poneiCaixa').classList.add('atira');
    $('canhao').classList.add('recuou');
    setTimeout(function(){ $('canhao').classList.remove('recuou'); }, 140);
    tom(340, .09);

    var cor = proxima;
    var el = document.createElement('div');
    el.className = 'bolha';
    el.style.width = el.style.height = (lado - 3) + 'px';
    el.style.background = corDe(cor).css;
    el.style.zIndex = 6;
    campo.appendChild(el);

    var pontos = t.pontos, i = 0, x = pontos[0].x, y = pontos[0].y;
    var VEL = 14;

    function passo(){
      var resta = VEL;
      while(resta > 0 && i < pontos.length - 1){
        var alvo = pontos[i + 1];
        var d = Math.sqrt(Math.pow(alvo.x - x, 2) + Math.pow(alvo.y - y, 2));
        if(d <= resta){ x = alvo.x; y = alvo.y; i++; resta -= d; }
        else{ x += (alvo.x - x) / d * resta; y += (alvo.y - y) / d * resta; resta = 0; }
      }
      el.style.left = (x - (lado - 3) / 2) + 'px';
      el.style.top  = (y - (lado - 3) / 2) + 'px';

      if(i < pontos.length - 1){ requestAnimationFrame(passo); return; }

      el.style.left = (posX(t.destino.l, t.destino.c) - (lado - 3) / 2) + 'px';
      el.style.top  = (posY(t.destino.l) - (lado - 3) / 2) + 'px';
      el.style.zIndex = '';
      el.classList.add('nasceu');
      grade[t.destino.l][t.destino.c] = { cor:cor, el:el };
      resolve(t.destino.l, t.destino.c);
      atirando = false;
      sorteiaProxima();
    }
    requestAnimationFrame(passo);
  }

  /* ---------- vizinhança hexagonal ----------
     Fileira par se encosta em (l±1, c-1) e (l±1, c); fileira ímpar em
     (l±1, c) e (l±1, c+1). Mais os dois lados. Seis vizinhas. */
  function vizinhos(l, c){
    var par = (l % 2 === 0);
    var lista = [[l, c - 1], [l, c + 1],
                 [l - 1, par ? c - 1 : c], [l - 1, par ? c : c + 1],
                 [l + 1, par ? c - 1 : c], [l + 1, par ? c : c + 1]];
    return lista.filter(function(p){
      return p[0] >= 0 && p[0] < MAX_LINHAS &&
             p[1] >= 0 && p[1] < larguraDaFila(p[0]);
    });
  }

  function grupo(l, c){
    var cor = grade[l][c] && grade[l][c].cor;
    if(!cor || cor === 'presa') return [];   /* gaiola não faz trio */
    var visto = {}, fila = [[l, c]], saida = [];
    visto[l + ',' + c] = 1;
    while(fila.length){
      var p = fila.pop();
      saida.push(p);
      vizinhos(p[0], p[1]).forEach(function(v){
        var k = v[0] + ',' + v[1];
        if(visto[k]) return;
        if(grade[v[0]][v[1]] && grade[v[0]][v[1]].cor === cor){ visto[k] = 1; fila.push(v); }
      });
    }
    return saida;
  }

  function respingos(el, corTom){
    var r = el.getBoundingClientRect(), cr = campo.getBoundingClientRect();
    for(var i = 0; i < 6; i++){
      var s = document.createElement('div');
      var t = 5 + Math.random() * 6;
      s.className = 'respingo';
      s.style.width = s.style.height = t + 'px';
      s.style.background = corTom;
      s.style.left = (r.left - cr.left + r.width / 2) + 'px';
      s.style.top  = (r.top - cr.top + r.height / 2) + 'px';
      s.style.setProperty('--rx', (Math.random() * 70 - 35).toFixed(0) + 'px');
      s.style.setProperty('--ry', (Math.random() * 70 - 35).toFixed(0) + 'px');
      campo.appendChild(s);
      setTimeout((function(e){ return function(){ if(e.parentNode) e.remove(); }; })(s), 520);
    }
  }

  function mostraCombo(el, n){
    var r = el.getBoundingClientRect(), cr = campo.getBoundingClientRect();
    var d = document.createElement('div');
    d.className = 'combo';
    d.textContent = n;
    d.style.fontSize = Math.min(20 + n * 4, 54) + 'px';
    d.style.left = (r.left - cr.left + r.width / 2) + 'px';
    d.style.top  = (r.top - cr.top + r.height / 2) + 'px';
    campo.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.remove(); }, 1050);
  }

  function resolve(l, c){
    var g = grupo(l, c);
    if(g.length < 3){ contaBolhas(); return; }

    mostraCombo(grade[l][c].el, g.length);
    campo.classList.remove('treme');
    void campo.offsetWidth;
    campo.classList.add('treme');
    if(g.length >= 5){
      $('poneiCaixa').classList.remove('festeja');
      void $('poneiCaixa').offsetWidth;
      $('poneiCaixa').classList.add('festeja');
    }

    /* dez por bolha, e um bônus que cresce com o tamanho da jogada:
       oito de uma vez tem que valer mais que duas de quatro */
    ganha(g.length * 10 + Math.max(0, g.length - 3) * 25);

    g.forEach(function(p, i){
      var b = grade[p[0]][p[1]];
      grade[p[0]][p[1]] = null;
      if(!b) return;
      setTimeout(function(){
        /* o tom sobe bolha a bolha: é o que faz jogada grande valer
           mais do que três jogadas pequenas */
        tom(520 + i * 70, .1);
        respingos(b.el, corDe(b.cor).tom);
        b.el.classList.add('estoura');
        setTimeout(function(){ if(b.el.parentNode) b.el.remove(); }, 360);
      }, i * 55);
    });

    setTimeout(soltaSoltas, g.length * 55 + 130);
  }

  /* bolha que perdeu a ligação com o teto cai com peso, girando: é o
     desmoronar que dá metade da graça do jogo */
  function soltaSoltas(){
    var preso = {}, fila = [];
    for(var c = 0; c < larguraDaFila(0); c++)
      if(grade[0][c]){ fila.push([0, c]); preso['0,' + c] = 1; }
    while(fila.length){
      var p = fila.pop();
      vizinhos(p[0], p[1]).forEach(function(v){
        var k = v[0] + ',' + v[1];
        if(preso[k] || !grade[v[0]][v[1]]) return;
        preso[k] = 1; fila.push(v);
      });
    }

    var caindo = 0, resgatou = 0;
    for(var l = 0; l < MAX_LINHAS; l++){
      for(var co = 0; co < grade[l].length; co++){
        if(!grade[l][co] || preso[l + ',' + co]) continue;
        if(grade[l][co].cor === 'presa'){
          resgata(grade[l][co], resgatou++);
        }else{
          despenca(grade[l][co].el, caindo++);
        }
        grade[l][co] = null;
      }
    }
    if(caindo) tom(300, .2);

    contaBolhas();
    /* a fase acaba quando todas as presas estiverem livres — ou, se
       ela limpar tudo antes, quando não sobrar bolha nenhuma */
    if(salvas >= totalPresas || contaBolhas() === 0){
      setTimeout(termina, (caindo || resgatou) ? 1200 : 250);
    }else sorteiaProxima();
  }

  /* A pônei livre desce até o colo da lançadora. É o momento da fase:
     a criança vê para quem serviu todo o esforço. */
  function resgata(bolha, ordem){
    salvas++;
    ganha(150);
    atualizaPlacar();

    setTimeout(function(){
      bolha.el.classList.add('salva');
      tom(700, .12);
      setTimeout(function(){ tom(880, .12); }, 110);
      setTimeout(function(){ tom(1180, .18); }, 220);

      var p = $('poneiCaixa');
      p.classList.remove('festeja');
      void p.offsetWidth;
      p.classList.add('festeja');

      mostraTexto('Salvou ' + bolha.ponei + '!');
      setTimeout(function(){ if(bolha.el.parentNode) bolha.el.remove(); }, 1150);
    }, ordem * 350);
  }

  /* o aviso grande no meio do campo, sem parar o jogo */
  function mostraTexto(txt){
    var d = document.createElement('div');
    d.className = 'combo';
    d.textContent = txt;
    d.style.fontSize = '26px';
    d.style.left = '50%';
    d.style.top  = '42%';
    campo.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.remove(); }, 1050);
  }

  function despenca(el, ordem){
    var y = parseFloat(el.style.top), x = parseFloat(el.style.left);
    var vy = -2 - Math.random() * 3, vx = (Math.random() * 4 - 2);
    var giro = 0, dgiro = (Math.random() * 16 - 8);
    var H = campo.clientHeight;
    el.style.zIndex = 4;

    function quadro(){
      vy += 0.75;                       // gravidade
      y += vy; x += vx; giro += dgiro;
      if(x < 0 || x > campo.clientWidth - lado) vx = -vx;   // quica na parede
      el.style.top = y + 'px';
      el.style.left = x + 'px';
      el.style.transform = 'rotate(' + giro + 'deg)';
      if(y < H + 60){ requestAnimationFrame(quadro); return; }
      if(el.parentNode) el.remove();
    }
    setTimeout(function(){ requestAnimationFrame(quadro); }, ordem * 30);
  }

  /* ---------- nível e fim ---------- */
  function nivelGuardado(){
    try{
      var id = localStorage.getItem(NIVEL_CHAVE);
      for(var i = 0; i < NIVEIS.length; i++) if(NIVEIS[i].id === id) return NIVEIS[i];
    }catch(e){}
    return null;
  }

  function pedeNivel(){
    var cx = $('opcoesNivel');
    cx.innerHTML = '';
    NIVEIS.forEach(function(n){
      var b = document.createElement('button');
      var am = '<span class="amostra">';
      for(var i = 0; i < n.cores; i++) am += '<i style="background:' + CORES[i].css + '"></i>';
      am += '</span>';
      b.innerHTML = am + '<span class="txt">' + n.nome +
        '<small>' + n.cores + ' cores · ' + n.presas + ' pôneis para salvar</small></span>';
      b.addEventListener('click', function(){
        if(typeof somToque === 'function'){ try{ somToque(); }catch(e){} }
        try{ localStorage.setItem(NIVEL_CHAVE, n.id); }catch(e){}
        $('nivel').classList.add('escondida');
        monta(n);
      });
      cx.appendChild(b);
    });
    $('nivel').classList.remove('escondida');
  }

  function termina(){
    if(terminado) return;
    terminado = true;
    $('prontoSub').textContent = salvas >= totalPresas
      ? 'Resgatou ' + salvas + (salvas === 1 ? ' pônei' : ' pôneis') + '! ' + pontos + ' pontos'
      : 'Limpou tudo! ' + pontos + ' pontos';
    if(typeof somVitoria === 'function'){ try{ somVitoria(); }catch(e){} }

    setTimeout(function(){
      $('prontoFoto').innerHTML = '<img src="' + foto + '" alt="">';
      $('prontoNome').textContent = ponei;
      $('pronto').classList.add('visivel');
    }, 700);

    /* daí em diante quem conduz é o album.js: prêmio, contagem de
       vitória e volta ao mapa */
    setTimeout(function(){
      $('pronto').classList.remove('visivel');
      if(typeof premiar === 'function') premiar();
      else location.href = 'index.html';
    }, 2600);
  }

  addEventListener('resize', function(){
    if(terminado) return;
    var antes = lado;
    medeLado();
    ajeitaCanhao();
    if(antes === lado) return;
    for(var l = 0; l < MAX_LINHAS; l++){
      for(var c = 0; c < grade[l].length; c++){
        if(!grade[l][c]) continue;
        var e = grade[l][c].el;
        e.style.width = e.style.height = (lado - 3) + 'px';
        e.style.left = (posX(l, c) - (lado - 3) / 2) + 'px';
        e.style.top  = (posY(l)    - (lado - 3) / 2) + 'px';
      }
    }
  });

  monta(nivelGuardado() || NIVEIS[0]);
  pedeNivel();
})();
</script>
