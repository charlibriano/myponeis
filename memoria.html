<style>
/* ===================================================================
   PALETA
   =================================================================== */
:root{
  --lilas:      #EFE3FF;
  --rosa-claro: #FFE4F2;
  --roxo:       #6B3FBF;
  --roxo-escuro:#4A2A87;
  --rosa:       #FF6FB0;
  --turquesa:   #35CFC9;
  --amarelo:    #FFD34A;
  --texto:      #40276E;
  --carta-raio: 18px;
  --gap: 10px;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html,body{ height:100%; overflow:hidden; }

body{
  font-family:'Baloo 2', 'Segoe UI Rounded', 'SF Pro Rounded', system-ui, sans-serif;
  color:var(--texto);
  background:
    radial-gradient(1200px 600px at 20% -10%, #FFF6C9 0%, transparent 55%),
    linear-gradient(160deg, var(--lilas) 0%, var(--rosa-claro) 100%);
  display:flex; flex-direction:column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none;
}

.tela{ display:none; flex:1; flex-direction:column; min-height:0; padding:14px; }
.tela.ativa{ display:flex; }

/* ===================================================================
   TELA INICIAL
   =================================================================== */
#tela-inicio{ align-items:center; justify-content:center; text-align:center; gap:6px; }

.titulo{
  font-size:clamp(38px, 13vw, 62px);
  font-weight:800;
  line-height:.95;
  color:var(--roxo);
  text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(107,63,191,.25);
}
.subtitulo{ font-size:17px; font-weight:600; color:#8A6FBF; margin-bottom:22px; }

.opcoes{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:300px; }

.botao{
  font-family:inherit; font-weight:800; font-size:21px;
  color:#fff; border:none; cursor:pointer;
  padding:16px 20px; border-radius:22px;
  background:linear-gradient(180deg, var(--rosa) 0%, #E3488F 100%);
  box-shadow:0 5px 0 #C43A79, 0 10px 18px rgba(196,58,121,.3);
  transition:transform .1s ease, box-shadow .1s ease;
}
.botao:active{ transform:translateY(4px); box-shadow:0 1px 0 #C43A79; }
.botao.turquesa{ background:linear-gradient(180deg, var(--turquesa) 0%, #23AFAA 100%); box-shadow:0 5px 0 #1B918D, 0 10px 18px rgba(27,145,141,.3); }
.botao.turquesa:active{ box-shadow:0 1px 0 #1B918D; }
.botao.roxo{ background:linear-gradient(180deg, #8B5CE0 0%, var(--roxo) 100%); box-shadow:0 5px 0 var(--roxo-escuro), 0 10px 18px rgba(74,42,135,.3); }
.botao.roxo:active{ box-shadow:0 1px 0 var(--roxo-escuro); }
.botao.pequeno{ font-size:15px; padding:11px 16px; border-radius:16px; }

/* ===================================================================
   BARRA DO JOGO
   =================================================================== */
.barra{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom:10px; flex:0 0 auto;
}
.placar{ display:flex; gap:8px; }
.marcador{
  background:rgba(255,255,255,.75);
  border-radius:14px; padding:6px 14px;
  font-weight:800; font-size:17px; color:var(--roxo);
  box-shadow:0 2px 6px rgba(107,63,191,.14);
  min-width:70px; text-align:center;
}
.marcador span{ display:block; font-size:10px; font-weight:600; color:#9A83C4; letter-spacing:.08em; text-transform:uppercase; }
.voltar{
  border:none; background:rgba(255,255,255,.75); color:var(--roxo);
  font-family:inherit; font-weight:800; font-size:22px;
  width:44px; height:44px; border-radius:14px; cursor:pointer;
  box-shadow:0 2px 6px rgba(107,63,191,.14);
}

/* ===================================================================
   TABULEIRO
   =================================================================== */
#tabuleiro{
  flex:1; min-height:0;
  display:grid;
  justify-content:center;
  align-content:center;
  /* as colunas, a altura da linha e o gap vem do JS (ajustaTabuleiro) */
}

.carta{
  position:relative;
  width:100%; height:100%;
  perspective:900px;
  cursor:pointer;
  background:none; border:none; padding:0;
}

.carta-interna{
  position:relative; width:100%; height:100%;
  transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,1.4,.5,1);
}
.carta.virada .carta-interna{ transform:rotateY(180deg); }

.face{
  position:absolute; inset:0;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:var(--carta-raio);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}

/* verso: a "cutie mark" — assinatura visual do jogo */
.verso{
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.35) 0%, transparent 45%),
    linear-gradient(150deg, #8B5CE0 0%, var(--roxo) 55%, var(--roxo-escuro) 100%);
  box-shadow:0 4px 0 rgba(74,42,135,.55), 0 6px 14px rgba(74,42,135,.28);
  border:3px solid rgba(255,255,255,.55);
}
.verso svg{ width:56%; height:56%; opacity:.95; }

.frente{
  transform:rotateY(180deg);
  background:#fff;
  border:3px solid var(--amarelo);
  box-shadow:0 4px 0 rgba(200,150,20,.35), 0 6px 14px rgba(107,63,191,.2);
  flex-direction:column;
}
.frente img{
  width:100%; height:100%;
  object-fit:contain;
  padding:6px 6px 0;
}
.frente .nome{
  flex:0 0 auto;
  width:100%;
  font-size:var(--nome-fs, 11px);
  font-weight:800;
  text-align:center;
  padding:3px 2px 4px;
  color:var(--roxo);
  background:#FFF6C9;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.frente .quebrado{
  font-size:11px; font-weight:600; color:#C0392B;
  padding:8px; text-align:center; line-height:1.3;
}

.carta.achou .carta-interna{ animation:pulo .5s ease; }
.carta.achou .frente{ border-color:var(--turquesa); box-shadow:0 0 0 4px rgba(53,207,201,.35); }
.carta.achou{ pointer-events:none; }
@keyframes pulo{
  0%{ transform:rotateY(180deg) scale(1); }
  40%{ transform:rotateY(180deg) scale(1.14); }
  100%{ transform:rotateY(180deg) scale(1); }
}

/* ===================================================================
   FIM DE JOGO
   =================================================================== */
#tela-fim{ align-items:center; justify-content:center; text-align:center; gap:8px; }
#tela-fim .titulo{ font-size:clamp(34px, 11vw, 54px); }
.estrela-cai{ position:fixed; top:-40px; font-size:26px; pointer-events:none; animation:cair linear forwards; }
@keyframes cair{ to{ transform:translateY(110vh) rotate(360deg); opacity:.2; } }

/* ===================================================================
   PAINEL DE ERROS  (aparece na tela, sem precisar de console)
   =================================================================== */
#erros{
  display:none;
  position:fixed; left:8px; right:8px; bottom:8px; z-index:50;
  background:#3B1220; color:#FFD9E4;
  border:2px solid #FF6FB0; border-radius:14px;
  padding:10px 12px; font-size:12px; line-height:1.45;
  max-height:44vh; overflow:auto;
  font-family:ui-monospace, Menlo, Consolas, monospace;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
#erros.visivel{ display:block; }
#erros h3{ font-family:inherit; font-size:13px; color:#fff; margin-bottom:6px; }
#erros ul{ padding-left:16px; }
#erros li{ margin-bottom:4px; word-break:break-all; }
#erros .fechar{
  position:absolute; top:6px; right:8px;
  background:none; border:none; color:#FFD9E4; font-size:18px; cursor:pointer;
}

#resultado-teste{
  margin-top:14px; font-size:14px; font-weight:600; color:var(--roxo); min-height:20px;
}

/* ===================================================================
   VOZ: status e recado  (ela não lê, mas o pai precisa ver o que houve)
   =================================================================== */
#btnStatus{
  position:fixed; top:calc(8px + env(safe-area-inset-top)); right:8px; z-index:40;
  border:none; border-radius:12px; cursor:pointer;
  font-family:inherit; font-weight:800; font-size:12px;
  padding:6px 10px;
  background:rgba(255,255,255,.8); color:#8A6FBF;
  box-shadow:0 2px 6px rgba(107,63,191,.14);
}
#btnTrocaVoz{
  position:fixed; top:calc(8px + env(safe-area-inset-top)); right:104px; z-index:40;
  border:none; border-radius:12px; cursor:pointer;
  font-family:inherit; font-weight:800; font-size:12px;
  padding:6px 10px;
  background:rgba(255,255,255,.8); color:#8A6FBF;
  box-shadow:0 2px 6px rgba(107,63,191,.14);
}
#btnTrocaVoz.escondida{ display:none; }
#btnStatus[data-ok="sim"]{ background:#D8F7F0; color:#12786F; }
#btnStatus[data-ok="nao"]{ background:#FFDDE6; color:#B02A4A; }

#recado{
  position:fixed; left:8px; right:8px; top:calc(46px + env(safe-area-inset-top)); z-index:45;
  background:#3B1220; color:#FFE6EE;
  border:2px solid var(--rosa); border-radius:14px;
  padding:10px 12px; font-size:13px; line-height:1.45; cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
#recado.escondida{ display:none; }

/* ===================================================================
   DIFICULDADE SEM TEXTO — a quantidade de cartinhas é a informação
   =================================================================== */
.nivel{
  display:flex; align-items:center; gap:14px;
  width:100%; padding:14px 18px; border:none; border-radius:24px;
  cursor:pointer; font-family:inherit;
  background:linear-gradient(180deg,#FFFFFF 0%, #F6EEFF 100%);
  box-shadow:0 5px 0 #D9C6F2, 0 10px 18px rgba(107,63,191,.18);
  transition:transform .1s ease, box-shadow .1s ease;
}
.nivel:active{ transform:translateY(4px); box-shadow:0 1px 0 #D9C6F2; }
.nivel .miniaturas{ display:grid; gap:3px; flex:0 0 auto; }
.nivel .mini{ width:12px; height:16px; border-radius:3px; background:linear-gradient(150deg,#8B5CE0,#4A2A87); }
.nivel .rotulo{ font-size:26px; font-weight:800; color:var(--roxo); line-height:1; }
.nivel .rotulo small{ display:block; font-size:12px; font-weight:600; color:#9A83C4; letter-spacing:.06em; text-transform:uppercase; }
.nivel .poneizinho{ margin-left:auto; font-size:30px; }

.nivel .miniaturas{ grid-template-columns:repeat(4, 12px); }
.nivel[data-pares="6"] .miniaturas{ grid-template-columns:repeat(6, 11px); }
.nivel[data-pares="6"] .mini{ width:11px; height:15px; }
.nivel[data-pares="8"] .miniaturas{ grid-template-columns:repeat(8, 10px); }
.nivel[data-pares="8"] .mini{ width:10px; height:14px; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

<!-- ================= TELA DO JOGO ================= -->
<section id="tela-jogo" class="tela">

    <button class="voltar" id="btn-menu" aria-label="Voltar aos jogos">🏠</button>

</section>

<!-- ================= TELA FINAL ================= -->
<section id="tela-fim" class="tela">
  <h1 class="titulo">Você achou todos!</h1>
  <p class="subtitulo" id="fim-detalhe"></p>
  <div class="opcoes">
    <button class="botao" id="btn-denovo">Jogar de novo</button>
    <button class="botao roxo" id="btn-inicio">Escolher outro</button>
  </div>
</section>

<div id="erros">

/* ===================================================================
   2. MOTOR DO JOGO
   =================================================================== */

const $ = (id) => document.getElementById(id);

// --- relatório de erros na própria tela (sem precisar de dev tools) ---
function reportarErro(texto){
  const painel = $("erros");
  const lista  = $("erros-lista");
  const item   = document.createElement("li");
  item.textContent = texto;
  lista.appendChild(item);
  painel.classList.add("visivel");
}
window.addEventListener("error", (e) => {
  reportarErro("Erro no código: " + e.message + "  (linha " + e.lineno + ")");
});

// os arquivos têm espaço e acento no nome, então precisam ser codificados
function urlDoPonei(p){ return BASE + encodeURIComponent(p.arquivo); }

/* voz, sons, elogios e diagnóstico: js/voz.js (compartilhado com o menu) */

// --- estado ---
let cartas = [], viradas = [], jogadas = 0, achados = 0, totalPares = 0, travado = false;

function embaralhar(lista){
  const c = lista.slice();
  for(let i = c.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c;
}

/* Escolhe o arranjo que deixa a carta MAIOR possível dentro do espaço real,
   testando todas as contagens de coluna. Antes o CSS derivava a largura da
   altura da linha, e no celular isso estourava a coluna e cortava as cartas. */
function ajustaTabuleiro(){
  const tab = $("tabuleiro");
  const n = cartas.length;
  if(!n) return;

  const L = tab.clientWidth, A = tab.clientHeight;
  if(L < 40 || A < 40) return;

  const gap = n > 12 ? 6 : 9;
  let melhor = null;

  for(let cols = 2; cols <= Math.min(6, n); cols++){
    const linhas = Math.ceil(n / cols);
    const largDisponivel = (L - gap * (cols - 1)) / cols;
    const altDisponivel  = (A - gap * (linhas - 1)) / linhas;
    // carta é 3:4, então a largura final é limitada pelos dois lados
    const larg = Math.min(largDisponivel, altDisponivel * 0.75);
    if(larg > 0 && (!melhor || larg > melhor.larg)) melhor = { larg, cols, linhas };
  }
  if(!melhor) return;

  const larg = Math.floor(melhor.larg);
  const alt  = Math.floor(larg * 4 / 3);

  tab.style.gap = gap + "px";
  tab.style.gridTemplateColumns = "repeat(" + melhor.cols + ", " + larg + "px)";
  tab.style.gridAutoRows = alt + "px";
  // o nome escrito acompanha o tamanho da carta, senão some ou estoura
  tab.style.setProperty("--nome-fs", Math.max(7, Math.min(13, Math.round(larg / 7))) + "px");
}

addEventListener("resize", ajustaTabuleiro);
addEventListener("orientationchange", () => setTimeout(ajustaTabuleiro, 250));

function mostrarTela(id){
  document.querySelectorAll(".tela").forEach(t => t.classList.remove("ativa"));
  $(id).classList.add("ativa");
}

function iniciar(pares){

  if(PONEIS.length < pares){
    reportarErro("A lista tem só " + PONEIS.length + " pôneis, mas o jogo pediu " + pares + " pares.");
    return;
  }

  totalPares = pares;
  jogadas = 0; achados = 0; viradas = []; travado = false;

  const escolhidos = embaralhar(PONEIS).slice(0, pares);
  cartas = embaralhar(escolhidos.concat(escolhidos));

  const tab = $("tabuleiro");
  tab.innerHTML = "";

  cartas.forEach((ponei, i) => {
    const btn = document.createElement("button");
    btn.className = "carta";
    btn.dataset.indice = i;
    btn.dataset.nome = ponei.nome;
    btn.setAttribute("aria-label", "Carta virada para baixo");
    btn.innerHTML =
      '<div class="carta-interna">' +
        '<div class="face verso">' +
          '<svg viewBox="0 0 100 100" aria-hidden="true">' +
            '<path fill="#FFD34A" d="M50 6l11 27 29 2-22 19 7 28-25-15-25 15 7-28L10 35l29-2z"/>' +
            '<circle cx="20" cy="20" r="4" fill="#FF6FB0"/>' +
            '<circle cx="82" cy="30" r="3" fill="#35CFC9"/>' +
            '<circle cx="26" cy="82" r="3" fill="#35CFC9"/>' +
            '<circle cx="78" cy="78" r="4" fill="#FF6FB0"/>' +
          '</svg>' +
        '</div>' +
        '<div class="face frente"></div>' +
      '</div>';

    const frente = btn.querySelector(".frente");
    const img = new Image();
    img.alt = ponei.nome;
    img.src = urlDoPonei(ponei);
    img.onerror = () => {
      frente.innerHTML = '<div class="quebrado">Imagem não carregou<br>' + ponei.arquivo + '</div>';
      reportarErro("Não carregou: " + urlDoPonei(ponei));
    };
    frente.appendChild(img);

    const nome = document.createElement("div");
    nome.className = "nome";
    nome.textContent = ponei.nome;
    frente.appendChild(nome);

    btn.addEventListener("click", () => virar(btn));
    tab.appendChild(btn);
  });

  atualizarPlacar();
  mostrarTela("tela-jogo");
  // só dá para medir depois que a tela virou visível
  requestAnimationFrame(ajustaTabuleiro);
  somComeco();
  setTimeout(() => fala('Ache os dois pôneis iguais! Toque em uma cartinha.'), 400);
  agendaDica();
}

function atualizarPlacar(){
  $("m-pares").textContent = achados + "/" + totalPares;
  $("m-jogadas").textContent = jogadas;
}

function virar(btn){
  if(travado) return;
  if(btn.classList.contains("virada")) return;

  cancelaDica();
  btn.classList.add("virada");
  btn.setAttribute("aria-label", btn.dataset.nome);
  somToque();
  viradas.push(btn);

  // ela não lê: o nome do pônei só existe se for falado
  fala(btn.dataset.nome);

  if(viradas.length < 2){ agendaDica(); return; }

  jogadas++;
  atualizarPlacar();
  const [a, b] = viradas;

  if(a.dataset.nome === b.dataset.nome){
    viradas = [];
    achados++;
    a.classList.add("achou");
    b.classList.add("achou");
    somAchou();
    atualizarPlacar();
    if(achados === totalPares){
      setTimeout(terminar, 700);
    }else{
      setTimeout(() => fala(escolhe(ELOGIOS) + ' ' + a.dataset.nome + '!'), 500);
      agendaDica();
    }
  }else{
    travado = true;
    setTimeout(() => { somErrou(); fala(escolhe(INCENTIVOS)); }, 450);
    setTimeout(() => {
      a.classList.remove("virada");
      b.classList.remove("virada");
      a.setAttribute("aria-label", "Carta virada para baixo");
      b.setAttribute("aria-label", "Carta virada para baixo");
      viradas = [];
      travado = false;
      agendaDica();
    }, 1800);
  }
}

/* se ela parar de tocar, a voz chama de volta em vez de ela ficar perdida */
let relogioDica = null;
function cancelaDica(){ clearTimeout(relogioDica); }
function agendaDica(){
  cancelaDica();
  relogioDica = setTimeout(() => {
    if($("tela-jogo").classList.contains("ativa")) fala('Toque em uma cartinha para virar.');
  }, 15000);
}

function terminar(){
  $("fim-detalhe").textContent = totalPares + " pares em " + jogadas + " jogadas";
  cancelaDica();
  // o prêmio vem primeiro: é ele que faz ela querer jogar de novo
  premiar(() => {
    mostrarTela("tela-fim");
    chuvaDeEstrelas();
  });
}

function chuvaDeEstrelas(){
  const simbolos = ["⭐","✨","🌈","💖","🦄"];
  for(let i = 0; i < 22; i++){
    const e = document.createElement("div");
    e.className = "estrela-cai";
    e.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
    e.style.left = Math.random() * 96 + "vw";
    e.style.animationDuration = (2.2 + Math.random() * 2) + "s";
    e.style.animationDelay = (Math.random() * 1.2) + "s";
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 6000);
  }
}

/* ===================================================================
   3. TESTE DE IMAGENS  — diz na tela quais URLs estão quebradas
   =================================================================== */
function testarImagens(){
  const saida = $("resultado-teste");
  $("erros-lista").innerHTML = "";
  $("erros").classList.remove("visivel");
  saida.textContent = "Testando " + PONEIS.length + " imagens...";

  let ok = 0, falhou = 0;
  const fim = () => {
    if(ok + falhou < PONEIS.length) return;
    saida.textContent = ok + " carregaram · " + falhou + " falharam";
    if(falhou > 0) reportarErro("Confira o BASE e os nomes dos arquivos no topo do código.");
  };

  PONEIS.forEach(p => {
    const img = new Image();
    img.onload  = () => { ok++; fim(); };
    img.onerror = () => { falhou++; reportarErro("Falhou: " + urlDoPonei(p)); fim(); };
    img.src = urlDoPonei(p);
  });
}

/* ===================================================================
   4. LIGAÇÕES DOS BOTÕES
   =================================================================== */
document.querySelectorAll("[data-pares]").forEach(b => {
  b.addEventListener("click", () => iniciar(parseInt(b.dataset.pares, 10)));
});
$("btn-testar").addEventListener("click", testarImagens);
$("btn-voltar-menu").addEventListener("click", () => { location.href = "index.html"; });
$("btn-menu").addEventListener("click", () => { cancelaDica(); mostrarTela("tela-inicio"); });
$("btn-denovo").addEventListener("click", () => iniciar(totalPares));
$("btn-inicio").addEventListener("click", () => mostrarTela("tela-inicio"));

  const n = parseInt(b.dataset.pares, 10) * 2;
  const alvo = b.querySelector(".miniaturas");
  for(let i = 0; i < n; i++){
    const m = document.createElement("span");
    m.className = "mini";
    alvo.appendChild(m);
  }
});
