<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Banho da Pônei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BANHO DA PÔNEI

   A primeira versão era raspadinha: uma foto parada e o dedo
   apagando uma camada de lama. Faltava o gesto. Nos jogos de banho
   que a criança conhece, o dedo SEGURA alguma coisa — chuveirinho,
   esponja — e o bicho reage.

   Aqui são três etapas, na ordem de um banho de verdade:
     1. molhar    — o chuveirinho joga água onde o dedo passa
     2. ensaboar  — a esponja tira a sujeira e deixa espuma
     3. enxaguar  — a água leva a espuma embora

   A pônei respira parada, pula quando ela encosta e se sacode no
   fim. Nada disso é desenho meu: a foto é a da pasta imagens/, e as
   ferramentas usam arte/chuveiro.png, arte/esponja.png e
   arte/toalha.png se existirem — caindo em emoji do sistema quando
   não existem, nunca em vetor desenhado à mão.
   ============================================================ */
:root{ --roxo:#6B3FBF; --rosa:#FF6FB0; --amarelo:#FFD34A; --agua:#5FC4E8; }
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  font-family:'Baloo 2','Segoe UI Rounded',system-ui,sans-serif;
  color:#40276E; user-select:none; overflow:hidden;
}
#app{
  height:100dvh; display:flex; flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));
  max-width:560px; margin:0 auto;
}
.hud{ display:flex; align-items:center; gap:8px; min-height:44px; }
.btn-icone{
  width:44px; height:44px; border:0; border-radius:999px;
  background:rgba(255,255,255,.78); font-size:20px; cursor:pointer;
  box-shadow:0 2px 0 rgba(62,42,92,.12);
}
.balao{
  margin-left:auto; background:#fff; border-radius:20px; padding:9px 16px;
  font-weight:800; font-size:clamp(14px,4.4vw,19px);
  box-shadow:0 4px 0 rgba(62,42,92,.10);
}
.balao b{ color:#D2439A; }
.versao{ font-size:10px; font-weight:600; color:#B0A0CC; margin-left:6px; }

#recado{
  margin-top:8px; padding:10px 13px; border-radius:14px;
  background:#3B1220; color:#FFE6EE; border:2px solid var(--rosa);
  font-size:12.5px; line-height:1.5; cursor:pointer; word-break:break-word;
}
#recado.escondida{ display:none; }

/* ---------- a banheira ---------- */
#banheira{
  position:relative; flex:0 0 auto;
  width:min(86vw, 350px); aspect-ratio:1; margin:12px auto 0;
  border-radius:34px; overflow:hidden;
  background:linear-gradient(180deg,#DFF3FF 0%,#BEE7FA 62%,#96D8F2 100%);
  border:7px solid #fff;
  box-shadow:0 0 0 5px #9FDCF0, 0 14px 30px rgba(62,42,92,.32);
  touch-action:none;
  cursor:none;
}
/* a água da banheira, subindo devagarinho no fundo */
#agua{
  position:absolute; left:0; right:0; bottom:0; height:22%;
  background:linear-gradient(180deg, rgba(120,215,245,.75), rgba(70,180,225,.9));
  border-radius:40% 40% 0 0 / 14% 14% 0 0;
  animation:ondinha 3.4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes ondinha{
  0%,100%{ transform:translateY(0)   scaleX(1); }
  50%    { transform:translateY(-4px) scaleX(1.04); }
}

/* a pônei: respira parada e pula quando encostam nela.
   Foto parada é o que mais mata a graça — bicho de jogo de banho
   sempre se mexe. */
#poneiCaixa{
  position:absolute; left:8%; right:8%; top:6%; bottom:14%;
  animation:respira 3.2s ease-in-out infinite;
  pointer-events:none;
}
#poneiCaixa.pulou{ animation:pulinho .5s ease-out; }
@keyframes respira{
  0%,100%{ transform:translateY(0)    rotate(-1.2deg) scale(1); }
  50%    { transform:translateY(-7px) rotate(1.2deg)  scale(1.02); }
}
@keyframes pulinho{
  0%  { transform:translateY(0)     scale(1); }
  35% { transform:translateY(-16px) scale(1.06) rotate(3deg); }
  70% { transform:translateY(4px)   scale(.98) rotate(-2deg); }
  100%{ transform:translateY(0)     scale(1); }
}
#poneiCaixa.secando{ animation:sacode .45s ease-in-out 4; }
@keyframes sacode{
  0%,100%{ transform:rotate(0)     translateX(0); }
  25%    { transform:rotate(-6deg) translateX(-7px); }
  75%    { transform:rotate(6deg)  translateX(7px); }
}
#foto{
  width:100%; height:100%;
  object-fit:contain;
  filter:saturate(var(--vico,.72)) brightness(var(--luz,.95));
  transition:filter .4s ease;
}
/* o brilho de molhada */
#poneiCaixa.molhada #foto{ filter:saturate(1.1) brightness(1.02) contrast(1.06); }

#lonaSujeira, #lonaEspuma{
  position:absolute; inset:0; width:100%; height:100%; pointer-events:none;
}

/* ---------- a ferramenta que segue o dedo ---------- */
#ferramenta{
  position:fixed; z-index:80; pointer-events:none;
  width:74px; height:74px; margin:-37px 0 0 -37px;
  display:flex; align-items:center; justify-content:center;
  font-size:46px; line-height:1;
  filter:drop-shadow(0 4px 6px rgba(40,60,90,.45));
  transition:transform .12s ease;
}
#ferramenta img{ width:100%; height:100%; object-fit:contain; }
#ferramenta.usando{ transform:scale(1.12) rotate(-8deg); }
#ferramenta.escondida{ display:none; }

/* gotas de água caindo do chuveirinho */
.gota{
  position:fixed; z-index:70; pointer-events:none;
  width:7px; height:11px; border-radius:50% 50% 45% 45%;
  background:linear-gradient(180deg, rgba(255,255,255,.9), var(--agua));
  animation:cai .55s ease-in forwards;
}
@keyframes cai{
  0%  { transform:translate(0,0) scale(.7); opacity:.95; }
  100%{ transform:translate(var(--dx,0), 90px) scale(1); opacity:0; }
}
.bolha{
  position:fixed; pointer-events:none; z-index:75; border-radius:50%;
  background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.95) 0 18%, rgba(255,255,255,.4) 42%, rgba(190,230,255,.3) 100%);
  border:1px solid rgba(255,255,255,.85);
  animation:bolhaSobe 1.4s ease-out forwards;
}
@keyframes bolhaSobe{
  0%  { transform:translate(0,0) scale(.4); opacity:.95; }
  100%{ transform:translate(var(--dx,0), -100px) scale(1.2); opacity:0; }
}

/* ---------- etapas e progresso ---------- */
#etapas{ display:flex; justify-content:center; gap:8px; margin-top:12px; }
.etapa{
  display:flex; align-items:center; gap:6px;
  padding:7px 13px; border-radius:16px;
  background:rgba(255,255,255,.6); color:#A08CC4;
  font-size:14px; font-weight:800;
}
.etapa .ico{ font-size:19px; }
.etapa.ativa{
  background:#fff; color:var(--roxo);
  box-shadow:0 4px 0 #D9C6F2;
  transform:scale(1.06);
}
.etapa.feita{ background:#E4F7EA; color:#2F7A52; }

#barra{
  width:min(86vw,350px); height:18px; margin:12px auto 0;
  border-radius:12px; background:rgba(255,255,255,.75); overflow:hidden;
  box-shadow:inset 0 2px 5px rgba(107,63,191,.18);
}
#barra i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg, var(--agua), var(--amarelo), var(--rosa));
  transition:width .25s ease;
}

/* ---------- fim ---------- */
#pronto{
  position:fixed; inset:0; z-index:200; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  padding:24px; text-align:center;
  background:radial-gradient(circle at 50% 40%, #FFF9DC 0%, #E9F7FF 55%, #EFE0FF 100%);
}
#pronto.visivel{ display:flex; }
#pronto .moldura{
  width:min(62vw,240px); aspect-ratio:1; border-radius:50%;
  overflow:hidden; border:6px solid var(--amarelo); background:#fff;
  box-shadow:0 12px 34px rgba(107,63,191,.3);
  animation:prontoEntra .6s cubic-bezier(.2,1.5,.4,1) both;
}
#pronto .moldura img{ width:100%; height:100%; object-fit:cover; object-position:center 30%; }
@keyframes prontoEntra{
  0%{ transform:scale(.3) rotate(-16deg); opacity:0; }
  100%{ transform:scale(1) rotate(0); opacity:1; }
}
#pronto .nome{ font-size:clamp(24px,7vw,36px); font-weight:800; color:var(--roxo); text-shadow:0 3px 0 #fff; }
#pronto .sub{ font-size:16px; font-weight:600; color:#8A6FBF; }
</style>
<link rel="stylesheet" href="cenario.css">
</head>
<body>
<div class="cenario-chao"></div>

<div id="app">
  <div class="hud">
    <button class="btn-icone" id="btnCasa" aria-label="Voltar ao mapa">🏠</button>
    <div class="balao" id="instrucao">Banho <b id="quem">…</b><span class="versao" id="versao"></span></div>
  </div>

  <div id="recado" class="escondida"></div>

  <div id="banheira">
    <div id="agua"></div>
    <div id="poneiCaixa"><img id="foto" alt=""></div>
    <canvas id="lonaSujeira"></canvas>
    <canvas id="lonaEspuma"></canvas>
  </div>

  <div id="etapas">
    <div class="etapa" id="et0"><span class="ico">🚿</span>Molhar</div>
    <div class="etapa" id="et1"><span class="ico">🧽</span>Ensaboar</div>
    <div class="etapa" id="et2"><span class="ico">🚿</span>Enxaguar</div>
  </div>

  <div id="barra"><i id="cheio"></i></div>
</div>

<div id="ferramenta" class="escondida"></div>

<div id="pronto">
  <div class="moldura" id="prontoFoto"></div>
  <div class="nome" id="prontoNome"></div>
  <div class="sub">Ficou limpinha e cheirosa!</div>
</div>

<script>
(function(){
  var VERSAO = 'v3';

  var PONEIS_BANHO = [
    'Rarity', 'Princesa Celestia', 'Princesa Cadance', 'Apple Bloom',
    'Sweetie Belle', 'Scootaloo', 'Trixie', 'Diamond Tiara',
    'Silver Spoon', 'Cheerilee', 'Lyra Heartstrings', 'Octavia Melody',
    'DJ Pon-3', 'Coco Pommel', 'Sunburst', 'Gilda',
    'Big McIntosh', 'Babs Seed', 'Twist', 'Pipsqueak'
  ];

  /* as ferramentas procuram arte de verdade e caem em emoji do
     sistema se ela não existir — nunca em vetor desenhado à mão */
  var FERRAMENTAS = {
    chuveiro: { arte:'arte/chuveiro.png', emoji:'🚿' },
    esponja:  { arte:'arte/esponja.png',  emoji:'🧽' }
  };

  var $ = function(id){ return document.getElementById(id); };

  function avisa(txt){
    var r = $('recado');
    if(!r) return;
    r.textContent = txt;
    r.classList.remove('escondida');
  }
  $('recado').addEventListener('click', function(){ $('recado').classList.add('escondida'); });
  window.addEventListener('error', function(e){
    avisa('Erro: ' + e.message + (e.lineno ? ' (linha ' + e.lineno + ')' : ''));
  });

  $('versao').textContent = VERSAO;
  $('btnCasa').addEventListener('click', function(){ location.href = 'index.html'; });

  var pool = PONEIS_BANHO;
  try{
    if(typeof colecao === 'function'){
      var minhas = colecao().filter(function(n){ return PONEIS_BANHO.indexOf(n) >= 0; });
      if(minhas.length >= 3) pool = minhas;
    }
  }catch(e){}

  var ponei = pool[Math.floor(Math.random() * pool.length)];
  var foto  = 'imagens/' + encodeURIComponent(ponei) + '.png';

  $('quem').textContent = ponei;
  $('foto').src = foto;
  $('foto').onerror = function(){
    avisa('A imagem de ' + ponei + ' não carregou (' + foto + ').');
  };

  /* ---------------- as duas camadas ---------------- */
  var LADO = 300;
  var cSuj = $('lonaSujeira'), xSuj = cSuj.getContext('2d');
  var cEsp = $('lonaEspuma'),  xEsp = cEsp.getContext('2d');
  cSuj.width = cSuj.height = LADO;
  cEsp.width = cEsp.height = LADO;

  /* Sujeira em placas translúcidas, não um tapume opaco: ela precisa
     reconhecer a pônei desde o começo. Banho é cuidar de alguém, não
     descobrir quem está embaixo. */
  (function pintaSujeira(){
    var tons = ['#6B4E2E','#8A6842','#5E4227','#9C7A52'];
    for(var i = 0; i < 22; i++){
      var cx = Math.random() * LADO, cy = 30 + Math.random() * (LADO - 60);
      var raio = 16 + Math.random() * 26;
      xSuj.globalAlpha = 0.5 + Math.random() * 0.3;
      xSuj.fillStyle = tons[i % tons.length];
      xSuj.beginPath();
      xSuj.arc(cx, cy, raio, 0, Math.PI * 2);
      xSuj.arc(cx + raio * .5, cy + raio * .3, raio * .7, 0, Math.PI * 2);
      xSuj.arc(cx - raio * .4, cy + raio * .4, raio * .6, 0, Math.PI * 2);
      xSuj.fill();
    }
    for(var j = 0; j < 40; j++){
      xSuj.globalAlpha = 0.35 + Math.random() * 0.35;
      xSuj.fillStyle = tons[j % tons.length];
      xSuj.beginPath();
      xSuj.arc(Math.random() * LADO, Math.random() * LADO, 3 + Math.random() * 8, 0, Math.PI * 2);
      xSuj.fill();
    }
    xSuj.globalAlpha = 1;
  })();

  /* ---------------- as etapas ---------------- */
  var ETAPAS = [
    { id:'molhar',   ferramenta:'chuveiro', texto:'Molha a ' , meta:.55 },
    { id:'ensaboar', ferramenta:'esponja',  texto:'Esfrega a ', meta:.90 },
    { id:'enxaguar', ferramenta:'chuveiro', texto:'Enxágua a ', meta:.88 }
  ];
  var etapa = 0, terminado = false;
  var molhado = [];              // grade de cobertura da etapa 1
  var GRADE = 12;
  for(var g = 0; g < GRADE * GRADE; g++) molhado.push(0);

  function mostraEtapa(){
    for(var i = 0; i < 3; i++){
      var e = $('et' + i);
      e.className = 'etapa' + (i < etapa ? ' feita' : (i === etapa ? ' ativa' : ''));
    }
    $('instrucao').innerHTML = ETAPAS[etapa].texto + '<b>' + ponei + '</b>!' +
      '<span class="versao">' + VERSAO + '</span>';
    poeFerramenta(ETAPAS[etapa].ferramenta);
  }

  function poeFerramenta(qual){
    var f = FERRAMENTAS[qual];
    var alvo = $('ferramenta');
    alvo.innerHTML = f.emoji;
    /* se a arte existir, ela substitui o emoji — sem esperar por ela */
    var t = new Image();
    t.onload = function(){ alvo.innerHTML = '<img src="' + f.arte + '" alt="">'; };
    t.src = f.arte;
  }

  /* ---------------- o dedo ---------------- */
  var ativo = false;
  var banheira = $('banheira');

  function local(ev){
    var r = banheira.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) / r.width  * LADO,
      y: (ev.clientY - r.top)  / r.height * LADO,
      dentro: ev.clientX >= r.left && ev.clientX <= r.right &&
              ev.clientY >= r.top  && ev.clientY <= r.bottom,
      telaX: ev.clientX, telaY: ev.clientY
    };
  }

  function moveFerramenta(ev){
    var f = $('ferramenta');
    f.classList.remove('escondida');
    f.style.left = ev.clientX + 'px';
    f.style.top  = ev.clientY + 'px';
  }

  function age(ev){
    if(terminado) return;
    var p = local(ev);
    if(!p.dentro) return;

    if(ETAPAS[etapa].id === 'molhar')        molha(p);
    else if(ETAPAS[etapa].id === 'ensaboar') ensaboa(p);
    else                                      enxagua(p);
  }

  /* etapa 1: a água cai do chuveirinho e vai molhando a pônei */
  function molha(p){
    for(var i = 0; i < 3; i++) gota(p.telaX, p.telaY);
    var cx = Math.floor(p.x / LADO * GRADE), cy = Math.floor(p.y / LADO * GRADE);
    for(var dy = -1; dy <= 1; dy++){
      for(var dx = -1; dx <= 1; dx++){
        var gx = cx + dx, gy = cy + dy;
        if(gx >= 0 && gx < GRADE && gy >= 0 && gy < GRADE) molhado[gy * GRADE + gx] = 1;
      }
    }
    var somados = 0;
    for(var k = 0; k < molhado.length; k++) somados += molhado[k];
    var q = somados / molhado.length;
    progresso(q);
    if(q >= ETAPAS[0].meta){
      $('poneiCaixa').classList.add('molhada');
      avanca();
    }
  }

  /* etapa 2: a esponja tira a sujeira e deixa espuma no lugar */
  function ensaboa(p){
    xSuj.globalCompositeOperation = 'destination-out';
    xSuj.beginPath();
    xSuj.arc(p.x, p.y, 26, 0, Math.PI * 2);
    xSuj.fill();
    xSuj.globalCompositeOperation = 'source-over';

    xEsp.globalCompositeOperation = 'source-over';
    xEsp.globalAlpha = .5;
    xEsp.fillStyle = '#FFFFFF';
    for(var i = 0; i < 5; i++){
      xEsp.beginPath();
      xEsp.arc(p.x + (Math.random() * 34 - 17), p.y + (Math.random() * 34 - 17),
               7 + Math.random() * 13, 0, Math.PI * 2);
      xEsp.fill();
    }
    xEsp.globalAlpha = 1;

    if(Math.random() < .5) bolha(p.telaX, p.telaY);
    progresso(limpeza());
    if(limpeza() >= ETAPAS[1].meta) avanca();
  }

  /* etapa 3: a água leva a espuma embora */
  function enxagua(p){
    for(var i = 0; i < 3; i++) gota(p.telaX, p.telaY);
    xEsp.globalCompositeOperation = 'destination-out';
    xEsp.beginPath();
    xEsp.arc(p.x, p.y, 30, 0, Math.PI * 2);
    xEsp.fill();
    xEsp.globalCompositeOperation = 'source-over';
    progresso(1 - cobertura(xEsp));
    if(1 - cobertura(xEsp) >= ETAPAS[2].meta) termina();
  }

  /* quanto de uma camada ainda cobre a pônei. Amostragem em grade:
     ler o canvas inteiro a cada movimento travaria o celular. */
  function cobertura(ctx){
    var d;
    try{ d = ctx.getImageData(0, 0, LADO, LADO).data; }catch(e){ return 0; }
    var passo = 10, total = 0, cheios = 0;
    for(var y = 0; y < LADO; y += passo){
      for(var x = 0; x < LADO; x += passo){
        total++;
        if(d[(y * LADO + x) * 4 + 3] > 30) cheios++;
      }
    }
    return total ? cheios / total : 0;
  }
  function limpeza(){ return 1 - cobertura(xSuj); }

  function progresso(q){
    $('cheio').style.width = Math.round(Math.max(0, Math.min(1, q)) * 100) + '%';
    document.documentElement.style.setProperty('--vico', (.72 + q * .45).toFixed(2));
  }

  function avanca(){
    if(etapa >= ETAPAS.length - 1) return;
    etapa++;
    $('cheio').style.width = '0%';
    if(typeof somVitoria === 'function'){ try{ somVitoria(); }catch(e){} }
    pula();
    mostraEtapa();
  }

  function pula(){
    var c = $('poneiCaixa');
    c.classList.remove('pulou');
    void c.offsetWidth;
    c.classList.add('pulou');
    setTimeout(function(){ c.classList.remove('pulou'); }, 520);
  }

  function gota(x, y){
    var d = document.createElement('div');
    d.className = 'gota';
    d.style.left = (x + Math.random() * 40 - 20) + 'px';
    d.style.top  = (y + 10) + 'px';
    d.style.setProperty('--dx', (Math.random() * 26 - 13).toFixed(0) + 'px');
    document.body.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 600);
  }

  function bolha(x, y){
    var b = document.createElement('div');
    var t = 12 + Math.random() * 20;
    b.className = 'bolha';
    b.style.width = b.style.height = t + 'px';
    b.style.left = (x - t / 2) + 'px';
    b.style.top  = (y - t / 2) + 'px';
    b.style.setProperty('--dx', (Math.random() * 60 - 30).toFixed(0) + 'px');
    document.body.appendChild(b);
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 1450);
  }

  banheira.addEventListener('pointerdown', function(ev){
    ativo = true;
    try{ banheira.setPointerCapture(ev.pointerId); }catch(e){}
    $('ferramenta').classList.add('usando');
    moveFerramenta(ev);
    pula();
    age(ev);
  });
  banheira.addEventListener('pointermove', function(ev){
    moveFerramenta(ev);
    if(ativo) age(ev);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){
    banheira.addEventListener(n, function(){
      ativo = false;
      $('ferramenta').classList.remove('usando');
    });
  });

  function termina(){
    if(terminado) return;
    terminado = true;
    xSuj.clearRect(0, 0, LADO, LADO);
    xEsp.clearRect(0, 0, LADO, LADO);
    $('cheio').style.width = '100%';
    $('et2').className = 'etapa feita';
    $('ferramenta').classList.add('escondida');
    $('instrucao').innerHTML = 'Prontinho!<span class="versao">' + VERSAO + '</span>';
    document.documentElement.style.setProperty('--vico', '1.15');
    document.documentElement.style.setProperty('--luz',  '1.06');

    /* a sacudida de secar: é o gesto que fecha um banho */
    var c = $('poneiCaixa');
    c.classList.remove('molhada');
    c.classList.add('secando');
    if(typeof somVitoria === 'function'){ try{ somVitoria(); }catch(e){} }

    var r = banheira.getBoundingClientRect();
    for(var i = 0; i < 24; i++){
      (function(i){
        setTimeout(function(){
          gota(r.left + Math.random() * r.width, r.top + Math.random() * r.height * .6);
          if(i % 2) bolha(r.left + Math.random() * r.width, r.top + Math.random() * r.height);
        }, i * 55);
      })(i);
    }

    setTimeout(function(){
      $('prontoFoto').innerHTML = '<img src="' + foto + '" alt="">';
      $('prontoNome').textContent = ponei;
      $('pronto').classList.add('visivel');
    }, 1700);

    setTimeout(function(){
      $('pronto').classList.remove('visivel');
      if(typeof premiar === 'function') premiar();
      else location.href = 'index.html';
    }, 3600);
  }

  mostraEtapa();
})();
</script>
