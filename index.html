<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Jogos dos Pôneis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --lilas:#EFE3FF; --rosa-claro:#FFE4F2;
  --roxo:#6B3FBF; --roxo-escuro:#4A2A87;
  --rosa:#FF6FB0; --turquesa:#35CFC9; --amarelo:#FFD34A;
  --texto:#40276E;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ min-height:100%; }
body{
  font-family:'Baloo 2','Segoe UI Rounded','SF Pro Rounded',system-ui,sans-serif;
  color:var(--texto);
  background:
    radial-gradient(1200px 600px at 20% -10%, #FFF6C9 0%, transparent 55%),
    linear-gradient(160deg, var(--lilas) 0%, var(--rosa-claro) 100%);
  display:flex; flex-direction:column; align-items:center;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));
  user-select:none;
}

.titulo{
  font-size:clamp(26px,7.5vw,40px); font-weight:800; line-height:.95;
  color:var(--roxo); text-align:center; margin-top:10px;
  text-shadow:0 3px 0 #fff, 0 6px 14px rgba(107,63,191,.25);
}
.subtitulo{ font-size:13px; font-weight:600; color:#8A6FBF; margin:3px 0 12px; text-align:center; }

/* ---------- grade de jogos ----------
   Antes eram sete cartões largos empilhados, o que dava um scroll
   enorme no celular. Duas colunas cabem seis jogos em três fileiras. */
.jogos{
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  width:100%; max-width:400px;
}

.jogo{
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  gap:6px; padding:12px 8px 10px; border:none; border-radius:22px;
  cursor:pointer; font-family:inherit; text-align:center;
  background:linear-gradient(180deg,#FFFFFF 0%,#F8F0FF 100%);
  box-shadow:0 5px 0 #D9C6F2, 0 10px 18px rgba(107,63,191,.18);
  transition:transform .1s ease, box-shadow .1s ease;
}
.jogo:active{ transform:translateY(4px); box-shadow:0 1px 0 #D9C6F2; }

/* o ícone é a identidade do jogo: ela não lê, então a figura precisa
   dizer sozinha qual brincadeira é */
.jogo .icone{
  width:100%; max-width:78px; aspect-ratio:1;
  display:flex; align-items:center; justify-content:center;
  border-radius:20px; padding:8px;
  background:#F3ECFF;
}
.jogo .icone svg{ width:100%; height:100%; }

/* os ícones balançam sozinhos, cada um no seu tempo, para o menu não
   parecer uma tabela parada */
.jogo .icone{ animation:iconeBoia 3.6s ease-in-out infinite; }
.jogo:nth-child(2) .icone{ animation-delay:.0s; }
.jogo:nth-child(3) .icone{ animation-delay:.5s; }
.jogo:nth-child(4) .icone{ animation-delay:1.0s; }
.jogo:nth-child(5) .icone{ animation-delay:1.5s; }
.jogo:nth-child(6) .icone{ animation-delay:2.0s; }
@keyframes iconeBoia{
  0%,100%{ transform:translateY(0)    rotate(-2deg); }
  50%    { transform:translateY(-5px) rotate(2deg); }
}

/* ao tocar, o ícone dá um pulo antes de trocar de página */
.jogo.tocado .icone{ animation:iconePula .42s cubic-bezier(.2,1.6,.4,1); }
@keyframes iconePula{
  0%  { transform:scale(1)    rotate(0); }
  40% { transform:scale(1.28) rotate(-9deg); }
  70% { transform:scale(.94)  rotate(5deg); }
  100%{ transform:scale(1)    rotate(0); }
}
.jogo.tocado{ box-shadow:0 2px 0 #D9C6F2, 0 0 0 4px rgba(255,111,176,.35); }

.faiscaMenu{
  position:fixed; pointer-events:none; z-index:60; font-size:20px;
  animation:faiscaMenuVoa .55s ease-out forwards;
}
@keyframes faiscaMenuVoa{
  from{ transform:translate3d(0,0,0) scale(.5); opacity:1; }
  to  { transform:translate3d(var(--fx,0), var(--fy,-40px),0) scale(1.25); opacity:0; }
}
.jogo .nome{ font-size:15px; font-weight:800; color:var(--roxo); line-height:1.1; }
.jogo .como{ display:none; }          /* a legenda escrita não serve para ela */

.jogo[data-cor="rosa"] .icone{ background:#FFE4F2; }
.jogo[data-cor="turq"] .icone{ background:#D8F7F0; }
.jogo[data-cor="amar"] .icone{ background:#FFF3CC; }
.jogo[data-cor="verde"] .icone{ background:#E0F5DF; }

/* o álbum ocupa a largura toda: é o painel de progresso, não um jogo */
.jogo.largo{
  grid-column:1 / -1;
  flex-direction:row; align-items:center; gap:12px;
  padding:10px 14px; text-align:left;
}
.jogo.largo .icone{ width:56px; max-width:56px; flex:0 0 auto; }
.jogo.largo .nome{ font-size:18px; }
.jogo.largo .como{ display:block; font-size:12px; font-weight:600; color:#9A83C4; margin-top:2px; }
.jogo.largo .seta{ margin-left:auto; font-size:22px; color:var(--rosa); }
.jogo .seta{ display:none; }

/* voz */
#btnStatus, #btnTrocaVoz{
  position:fixed; top:calc(8px + env(safe-area-inset-top)); z-index:40;
  border:none; border-radius:12px; cursor:pointer;
  font-family:inherit; font-weight:800; font-size:12px; padding:6px 10px;
  background:rgba(255,255,255,.8); color:#8A6FBF;
  box-shadow:0 2px 6px rgba(107,63,191,.14);
}
#btnStatus{ right:8px; }
#btnTrocaVoz{ right:104px; }
#btnStatus[data-ok="sim"]{ background:#D8F7F0; color:#12786F; }
#btnStatus[data-ok="nao"]{ background:#FFDDE6; color:#B02A4A; }
#recado{
  position:fixed; left:8px; right:8px; top:calc(46px + env(safe-area-inset-top)); z-index:45;
  background:#3B1220; color:#FFE6EE; border:2px solid var(--rosa); border-radius:14px;
  padding:10px 12px; font-size:13px; line-height:1.45; cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
#recado.escondida{ display:none; }

/* telas baixas (iPhone SE e parecidos): aperta o cabeçalho e os ícones
   para os seis jogos caberem sem rolagem */
@media (max-height: 720px){
  .titulo{ font-size:24px; margin-top:4px; }
  .subtitulo{ display:none; }
  .recepcao{ padding:6px 12px 6px 6px; margin-bottom:8px; }
  .recepcao .amiga{ width:48px; height:48px; }
  .jogo{ padding:8px 6px 8px; gap:4px; }
  .jogo .icone{ max-width:58px; padding:6px; }
  .jogo .nome{ font-size:14px; }
  .jogo.largo .icone{ width:46px; max-width:46px; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

/* ---------- a amiga recebendo ela ---------- */
.recepcao{
  display:flex; align-items:center; gap:12px;
  width:100%; max-width:400px; margin:0 auto 10px;
  background:rgba(255,255,255,.82); border-radius:22px; padding:8px 14px 8px 8px;
  box-shadow:0 5px 0 #D9C6F2, 0 10px 20px rgba(107,63,191,.18);
}
.recepcao .amiga{
  position:relative;
  flex:0 0 auto; width:56px; height:56px; border-radius:50%;
  /* overflow visível para o enfeite poder passar da borda do retrato */
  overflow:visible;
  border:3px solid #FFD34A; background:#FFF6C9;
  animation:balanca 3.6s ease-in-out infinite;
}
.recepcao .amiga img{ width:100%; height:100%; border-radius:50%; object-fit:cover; object-position:center 34%; }
.recepcao .fala{ flex:1; min-width:0; }
.recepcao .oi{ font-size:17px; font-weight:800; color:var(--roxo); line-height:1.1; }
.recepcao .tarefa{ font-size:11px; font-weight:600; color:#9A83C4; margin:2px 0 3px; }

/* ---------- primeira vez: quem vai brincar? ---------- */
#apresentacao{
  position:fixed; inset:0; z-index:120; display:none;
  align-items:center; justify-content:flex-start; flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  text-align:center; overflow-y:auto;
  /* deixa o cenário do fundo aparecer por trás em vez de tapar tudo */
  background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,240,250,.88) 100%);
  backdrop-filter:blur(2px);
}
#apresentacao.visivel{ display:flex; }

.cartao{
  width:100%; max-width:360px;
  background:#fff; border-radius:30px;
  padding:22px 18px 24px;
  box-shadow:0 8px 0 #E4D8F5, 0 18px 34px rgba(107,63,191,.24);
  border:3px solid #fff;
}

#apresentacao .estrelinhas{ font-size:26px; letter-spacing:6px; margin-bottom:2px; }
#apresentacao h2{
  font-size:27px; font-weight:800; color:var(--roxo); line-height:1.1;
  text-shadow:0 2px 0 #fff;
}
#apresentacao p{ font-size:13px; font-weight:600; color:#9A83C4; margin:4px 0 14px; }

/* o campo mostra o nome em letras grandes: ela já sabe escrever o dela,
   e ver a própria letra aparecendo grande faz parte da graça */
#campoNome{
  font-family:inherit; font-size:30px; font-weight:800; text-align:center;
  letter-spacing:2px; color:var(--roxo);
  border:3px solid #E4D8F5; border-radius:20px;
  padding:12px 14px; width:100%; background:#FBF6FF;
  outline:none; transition:border-color .2s ease, box-shadow .2s ease;
}
#campoNome:focus{ border-color:var(--rosa); box-shadow:0 0 0 4px rgba(255,111,176,.22); background:#fff; }
#campoNome::placeholder{ color:#CFC0E8; font-size:22px; letter-spacing:1px; }

.divisor{
  display:flex; align-items:center; gap:10px;
  margin:20px 0 12px; color:#C4B4E0; font-size:12px; font-weight:800;
  text-transform:uppercase; letter-spacing:.12em;
}
.divisor::before, .divisor::after{
  content:""; flex:1; height:3px; border-radius:2px;
  background:linear-gradient(90deg, transparent, #E4D8F5, transparent);
}

.escolhaAmigas{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:10px;
}
.escolhaAmigas button{
  border:3px solid #E4D8F5; background:#FBF6FF; border-radius:50%;
  aspect-ratio:1; width:100%; padding:0; overflow:hidden; cursor:pointer;
  transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.escolhaAmigas button:active{ transform:scale(.94); }
.escolhaAmigas button.marcada{
  border-color:var(--rosa);
  box-shadow:0 0 0 5px rgba(255,111,176,.28), 0 4px 10px rgba(196,58,121,.3);
  transform:scale(1.08);
}
.escolhaAmigas img{ width:100%; height:100%; object-fit:cover; object-position:center 34%; }

#nomeDaAmiga{
  min-height:22px; margin-top:10px;
  font-size:16px; font-weight:800; color:var(--rosa);
}

/* o botão existia com a classe .botao, que nunca foi definida nesta
   página — por isso saía o botão cru do navegador */
#btnComecar{
  margin-top:18px; width:100%;
  border:none; border-radius:24px; cursor:pointer;
  font-family:inherit; font-weight:800; font-size:24px; color:#fff;
  padding:16px 20px;
  background:linear-gradient(180deg, #FF8FC0 0%, #E3488F 100%);
  box-shadow:0 6px 0 #C43A79, 0 12px 22px rgba(196,58,121,.32);
  transition:transform .1s ease, box-shadow .1s ease, filter .2s ease;
}
#btnComecar:active{ transform:translateY(5px); box-shadow:0 1px 0 #C43A79; }
#btnComecar.esperando{ filter:grayscale(.5) opacity(.6); }

<script>
/* os cartões agora usam ícones desenhados, não fotos — não há
   imagem que possa falhar */

/* ===================================================================
   PERFIL: primeira vez, e a recepção da amiga
   =================================================================== */
injetaEstiloPerfil();

let amigaEscolhida = null;

function montaEscolha(){
  const cx = document.getElementById("escolhaAmigas");
  cx.innerHTML = "";
  AMIGAS.forEach(nome => {
    const b = document.createElement("button");
    b.innerHTML = '<img src="imagens/' + encodeURIComponent(nome) + '.png" alt="' + nome + '">';
    b.addEventListener("click", () => {
      amigaEscolhida = nome;
      cx.querySelectorAll("button").forEach(x => x.classList.remove("marcada"));
      b.classList.add("marcada");
      // ela não lê ainda, mas o pai precisa saber quem escolheu
      document.getElementById("nomeDaAmiga").textContent = nome;
      if(typeof somToque === "function") somToque();
      confereBotao();
    });
    cx.appendChild(b);
  });
}

/* o botão só ganha cor quando há nome e amiga escolhidos — assim ele
   não parece quebrado quando o toque não faz nada */
function confereBotao(){
  const pronto = document.getElementById("campoNome").value.trim() !== "" && amigaEscolhida;
  document.getElementById("btnComecar").classList.toggle("esperando", !pronto);
}

function abreApresentacao(){
  montaEscolha();
  document.getElementById("campoNome").addEventListener("input", confereBotao);
  document.getElementById("apresentacao").classList.add("visivel");
}

document.getElementById("btnComecar").addEventListener("click", () => {
  const nome = document.getElementById("campoNome").value.trim();
  if(!nome){ document.getElementById("campoNome").focus(); return; }
  if(!amigaEscolhida) amigaEscolhida = AMIGAS[0];

  const p = perfil();
  p.nome = nome;
  p.amiga = amigaEscolhida;
  salvaPerfil(p);

  document.getElementById("apresentacao").classList.remove("visivel");
  mostraRecepcao();
  if(typeof somVitoria === "function") somVitoria();
});

function mostraRecepcao(){
  if(!temPerfil()) return;
  const m = missao();
  const feito = m.feitos >= DESAFIOS_POR_DIA;

  const foto = document.getElementById("amigaFoto");
  foto.innerHTML = '<img src="' + imgDaAmiga() + '" alt="' + amigaDela() + '">';
  // é AQUI que o enfeite ganho nos labirintos aparece, todo dia
  if(typeof poeEnfeite === "function") poeEnfeite(foto);
  document.getElementById("amigaOi").textContent = "Oi, " + nomeDela() + "!";
  document.getElementById("amigaTarefa").textContent = feito
    ? "Missão de hoje cumprida!"
    : "Faltam " + (DESAFIOS_POR_DIA - m.feitos) + " brincadeiras hoje";
  document.getElementById("fitaAqui").innerHTML = fitaDaMissao();
  document.getElementById("recepcao").style.display = "flex";
}

if(temPerfil()) mostraRecepcao(); else abreApresentacao();

/* a amiga fala no primeiro toque da tela — antes disso o celular
   não deixa sair som nenhum */
let jaSaudou = false;
addEventListener("pointerdown", () => {
  if(jaSaudou || !temPerfil()) return;
  jaSaudou = true;
  const m = missao();
  if(typeof fala !== "function") return;
  fala(m.feitos >= DESAFIOS_POR_DIA
    ? "Oi " + nomeDela() + "! Você já fez tudo hoje. Quer brincar mais?"
    : "Oi " + nomeDela() + "! Faltam " + (DESAFIOS_POR_DIA - m.feitos) + " brincadeiras para terminar a missão de hoje.");
}, { once:false });

/* o menu mostra quantas ela já tem — o progresso fica visível na abertura */
try{
  const q = document.getElementById("quantasTenho");
  if(q && typeof quantasTem === "function") q.textContent = quantasTem() + " de " + totalDoAlbum() + " pôneis";
}catch(e){}

function faiscasNoToque(b){
  const r = b.getBoundingClientRect();
  const simbolos = ["✨", "⭐", "💖"];
  for(let i = 0; i < 6; i++){
    const f = document.createElement("div");
    f.className = "faiscaMenu";
    f.textContent = simbolos[i % 3];
    f.style.left = (r.left + r.width / 2 - 10) + "px";
    f.style.top  = (r.top + r.height / 2 - 10) + "px";
    f.style.setProperty("--fx", (Math.random() * 90 - 45) + "px");
    f.style.setProperty("--fy", (-25 - Math.random() * 45) + "px");
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 600);
  }
}

document.querySelectorAll(".jogo").forEach(b => {
  b.addEventListener("click", () => {
    const destino = b.dataset.pagina;

    try{ if(typeof somToque === "function") somToque(); }catch(e){}

    // o pulo do ícone e as faíscas dão retorno ao toque; 300ms é o
    // tempo da animação, não espera inventada
    b.classList.add("tocado");
    faiscasNoToque(b);

    setTimeout(() => { location.href = destino; }, 300);
  });
});
</script>
