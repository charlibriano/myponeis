<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Jogos dos Pôneis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --lilas:#EFE3FF; --rosa-claro:#FFE4F2;
  --roxo:#6B3FBF; --roxo-escuro:#4A2A87;
  --rosa:#FF6FB0; --turquesa:#35CFC9; --amarelo:#FFD34A;
  --texto:#40276E;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ min-height:100%; }
body{
  font-family:'Baloo 2','Segoe UI Rounded','SF Pro Rounded',system-ui,sans-serif;
  color:var(--texto);
  background:
    radial-gradient(1200px 600px at 20% -10%, #FFF6C9 0%, transparent 55%),
    linear-gradient(160deg, var(--lilas) 0%, var(--rosa-claro) 100%);
  display:flex; flex-direction:column; align-items:center;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));
  user-select:none;
}

.titulo{
  font-size:clamp(32px,10vw,52px); font-weight:800; line-height:.95;
  color:var(--roxo); text-align:center; margin-top:26px;
  text-shadow:0 3px 0 #fff, 0 6px 14px rgba(107,63,191,.25);
}
.subtitulo{ font-size:16px; font-weight:600; color:#8A6FBF; margin:6px 0 24px; text-align:center; }

.jogos{ display:flex; flex-direction:column; gap:16px; width:100%; max-width:340px; }

.jogo{
  display:flex; align-items:center; gap:14px;
  width:100%; padding:12px 16px 12px 12px; border:none; border-radius:26px;
  cursor:pointer; font-family:inherit; text-align:left;
  background:linear-gradient(180deg,#FFFFFF 0%,#F8F0FF 100%);
  box-shadow:0 6px 0 #D9C6F2, 0 12px 22px rgba(107,63,191,.2);
  transition:transform .1s ease, box-shadow .1s ease;
}
.jogo:active{ transform:translateY(5px); box-shadow:0 1px 0 #D9C6F2; }

.retrato{
  flex:0 0 auto; width:82px; height:82px; border-radius:20px;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  border:3px solid var(--amarelo); background:#FFF6C9;
}
.retrato img{ width:100%; height:100%; object-fit:contain; padding:4px; }
.retrato .fallback{ font-size:38px; }

.jogo .texto{ flex:1; min-width:0; }
.jogo .nome{ display:block; font-size:23px; font-weight:800; color:var(--roxo); line-height:1.05; }
.jogo .como{ display:block; font-size:13px; font-weight:600; color:#9A83C4; margin-top:3px; }
.jogo .seta{ font-size:26px; color:var(--rosa); flex:0 0 auto; }

.jogo[data-cor="rosa"] .retrato{ border-color:var(--rosa); background:#FFE4F2; }
.jogo[data-cor="turq"] .retrato{ border-color:var(--turquesa); background:#D8F7F0; }

/* voz */
#btnStatus, #btnTrocaVoz{
  position:fixed; top:calc(8px + env(safe-area-inset-top)); z-index:40;
  border:none; border-radius:12px; cursor:pointer;
  font-family:inherit; font-weight:800; font-size:12px; padding:6px 10px;
  background:rgba(255,255,255,.8); color:#8A6FBF;
  box-shadow:0 2px 6px rgba(107,63,191,.14);
}
#btnStatus{ right:8px; }
#btnTrocaVoz{ right:104px; }
#btnStatus[data-ok="sim"]{ background:#D8F7F0; color:#12786F; }
#btnStatus[data-ok="nao"]{ background:#FFDDE6; color:#B02A4A; }
#recado{
  position:fixed; left:8px; right:8px; top:calc(46px + env(safe-area-inset-top)); z-index:45;
  background:#3B1220; color:#FFE6EE; border:2px solid var(--rosa); border-radius:14px;
  padding:10px 12px; font-size:13px; line-height:1.45; cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
#recado.escondida{ display:none; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

/* ---------- a amiga recebendo ela ---------- */
.recepcao{
  display:flex; align-items:center; gap:14px;
  width:100%; max-width:340px; margin:0 auto 16px;
  background:rgba(255,255,255,.82); border-radius:26px; padding:12px 16px 12px 12px;
  box-shadow:0 5px 0 #D9C6F2, 0 10px 20px rgba(107,63,191,.18);
}
.recepcao .amiga{
  flex:0 0 auto; width:76px; height:76px; border-radius:50%; overflow:hidden;
  border:3px solid #FFD34A; background:#FFF6C9;
  animation:balanca 3.6s ease-in-out infinite;
}
.recepcao .amiga img{ width:100%; height:100%; object-fit:cover; object-position:center 34%; }
.recepcao .fala{ flex:1; min-width:0; }
.recepcao .oi{ font-size:20px; font-weight:800; color:var(--roxo); line-height:1.1; }
.recepcao .tarefa{ font-size:12px; font-weight:600; color:#9A83C4; margin:4px 0 5px; }

/* ---------- primeira vez: quem é você? ---------- */
#apresentacao{
  position:fixed; inset:0; z-index:120; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  padding:22px; text-align:center;
  background:linear-gradient(160deg,#EFE3FF 0%,#FFE4F2 100%);
  overflow-y:auto;
}
#apresentacao.visivel{ display:flex; }
#apresentacao h2{ font-size:26px; color:var(--roxo); }
#apresentacao p{ font-size:14px; color:#8A6FBF; max-width:320px; }
#campoNome{
  font-family:inherit; font-size:22px; font-weight:800; text-align:center;
  color:var(--roxo); border:3px solid #D9C6F2; border-radius:18px;
  padding:12px 16px; width:min(78vw,280px); background:#fff;
}
.escolhaAmigas{
  display:grid; grid-template-columns:repeat(4,72px); gap:10px; justify-content:center;
}
.escolhaAmigas button{
  border:3px solid #E4D8F5; background:#fff; border-radius:50%;
  width:72px; height:72px; padding:0; overflow:hidden; cursor:pointer;
}
.escolhaAmigas button.marcada{ border-color:#FF6FB0; box-shadow:0 0 0 4px rgba(255,111,176,.3); }
.escolhaAmigas img{ width:100%; height:100%; object-fit:cover; object-position:center 34%; }
</style>
<link rel="stylesheet" href="cenario.css">
</head>
<body>
<div class="cenario-chao"></div>
<div class="cenario-brilho" style="left:8%;  top:30%; animation-delay:0s">✨</div>
<div class="cenario-brilho" style="left:86%; top:44%; animation-delay:1.6s">⭐</div>
<div class="cenario-brilho" style="left:20%; top:68%; animation-delay:3.1s">✨</div>
<div class="cenario-brilho" style="left:72%; top:22%; animation-delay:4.4s">💖</div>

<button id="btnStatus" data-ok="?">🔈 testar voz</button>
<button id="btnTrocaVoz">trocar voz</button>
<div id="recado" class="escondida"></div>

<h1 class="titulo">Jogos dos Pôneis</h1>
<p class="subtitulo">Escolha uma brincadeira</p>

<div class="recepcao" id="recepcao" style="display:none">
  <span class="amiga" id="amigaFoto"></span>
  <span class="fala">
    <span class="oi" id="amigaOi">Oi!</span>
    <span class="tarefa" id="amigaTarefa"></span>
    <span id="fitaAqui"></span>
  </span>
</div>

<div class="jogos">

  <button class="jogo" data-cor="turq" data-pagina="album.html"
          data-fala="Seu álbum de pôneis!">
    <span class="retrato"><img src="imagens/Princesa Cadance.png" alt=""></span>
    <span class="texto">
      <span class="nome">Meu Álbum</span>
      <span class="como" id="quantasTenho">Suas pôneis</span>
    </span>
    <span class="seta" aria-hidden="true">▶</span>
  </button>


  <button class="jogo" data-cor="roxo" data-pagina="memoria.html"
          data-fala="Jogo da memória! Ache os dois pôneis iguais.">
    <span class="retrato"><img src="imagens/Rarity.png" alt=""></span>
    <span class="texto">
      <span class="nome">Jogo da Memória</span>
      <span class="como">Ache os dois iguais</span>
    </span>
    <span class="seta" aria-hidden="true">▶</span>
  </button>

  <button class="jogo" data-cor="rosa" data-pagina="poneis.html"
          data-fala="Cadê o pônei? Eu falo o nome e você acha!">
    <span class="retrato"><img src="imagens/Trixie.png" alt=""></span>
    <span class="texto">
      <span class="nome">Cadê o Pônei?</span>
      <span class="como">Eu falo, você acha</span>
    </span>
    <span class="seta" aria-hidden="true">▶</span>
  </button>

  <button class="jogo" data-cor="turq" data-pagina="poneis.html"
          data-fala="Quem sumiu? Olha bem e descubra qual pônei foi embora.">
    <span class="retrato"><img src="imagens/Princesa Celestia.png" alt=""></span>
    <span class="texto">
      <span class="nome">Quem Sumiu?</span>
      <span class="como">Descubra quem foi embora</span>
    </span>
    <span class="seta" aria-hidden="true">▶</span>
  </button>

  <button class="jogo" data-cor="roxo" data-pagina="labirinto.html"
          data-fala="Leva o pônei! Arraste o dedo pelo caminho até a amiga.">
    <span class="retrato"><img src="imagens/Apple Bloom.png" alt=""></span>
    <span class="texto">
      <span class="nome">Leva o Pônei</span>
      <span class="como">Ache o caminho até a amiga</span>
    </span>
    <span class="seta" aria-hidden="true">▶</span>
  </button>

  <button class="jogo" data-cor="rosa" data-pagina="nome.html"
          data-fala="Balões do nome! Estoura os balões e escreve o seu nome.">
    <span class="retrato"><img src="imagens/Sweetie Belle.png" alt=""></span>
    <span class="texto">
      <span class="nome">Balões do Nome</span>
      <span class="como">Estoure na ordem certa</span>
    </span>
    <span class="seta" aria-hidden="true">▶</span>
  </button>

</div>

<div id="apresentacao">
  <h2>Quem vai brincar?</h2>
  <p>Escreva o nome dela. A voz vai chamar por ele durante os jogos.</p>
  <input id="campoNome" maxlength="14" placeholder="nome" autocomplete="off">
  <h2 style="margin-top:10px">Escolha a amiga</h2>
  <p>Essa pônei acompanha ela em todos os jogos.</p>
  <div class="escolhaAmigas" id="escolhaAmigas"></div>
  <button class="botao" id="btnComecar" style="margin-top:10px">Começar</button>
</div>

<script src="voz.js"></script>
<script src="perfil.js"></script>
<script src="album.js"></script>
<script>
/* se a imagem do retrato não carregar, entra um emoji no lugar
   (mesma ideia do relatório de imagens: nada quebra pela metade) */
const RESERVA = ["📖", "🃏", "🔍", "❓", "🌀", "🎈"];
document.querySelectorAll(".retrato img").forEach((img, i) => {
  img.addEventListener("error", () => {
    const s = document.createElement("span");
    s.className = "fallback";
    s.textContent = RESERVA[i] || "🦄";
    img.replaceWith(s);
  });
});

/* qualquer erro de código aparece na tela, sem precisar de dev tools */
addEventListener("error", e => {
  const r = document.getElementById("recado");
  if(!r) return;
  r.textContent = "Erro: " + e.message + (e.filename ? "  (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "");
  r.classList.remove("escondida");
});

/* o voz.js pode não ter carregado. A navegação NÃO pode depender dele. */
const TEM_VOZJS = (typeof fala === "function" && typeof somToque === "function");
if(!TEM_VOZJS){
  const r = document.getElementById("recado");
  r.textContent = "O arquivo js/voz.js não carregou, então os jogos abrem sem voz. Confira se ele está na pasta js/ do projeto.";
  r.classList.remove("escondida");
  const b = document.getElementById("btnStatus");
  if(b){ b.textContent = "🔇 sem voz.js"; b.dataset.ok = "nao"; }
}

/* ===================================================================
   PERFIL: primeira vez, e a recepção da amiga
   =================================================================== */
injetaEstiloPerfil();

let amigaEscolhida = null;

function montaEscolha(){
  const cx = document.getElementById("escolhaAmigas");
  cx.innerHTML = "";
  AMIGAS.forEach(nome => {
    const b = document.createElement("button");
    b.innerHTML = '<img src="imagens/' + encodeURIComponent(nome) + '.png" alt="' + nome + '">';
    b.addEventListener("click", () => {
      amigaEscolhida = nome;
      cx.querySelectorAll("button").forEach(x => x.classList.remove("marcada"));
      b.classList.add("marcada");
      if(typeof somToque === "function") somToque();
      if(typeof fala === "function") fala(nome);
    });
    cx.appendChild(b);
  });
}

function abreApresentacao(){
  montaEscolha();
  document.getElementById("apresentacao").classList.add("visivel");
}

document.getElementById("btnComecar").addEventListener("click", () => {
  const nome = document.getElementById("campoNome").value.trim();
  if(!nome){ document.getElementById("campoNome").focus(); return; }
  if(!amigaEscolhida) amigaEscolhida = AMIGAS[0];

  const p = perfil();
  p.nome = nome;
  p.amiga = amigaEscolhida;
  salvaPerfil(p);

  document.getElementById("apresentacao").classList.remove("visivel");
  mostraRecepcao();
  if(typeof fala === "function") fala("Oi " + nome + "! Eu sou " + amigaEscolhida + ". Vamos brincar!");
});

function mostraRecepcao(){
  if(!temPerfil()) return;
  const m = missao();
  const feito = m.feitos >= DESAFIOS_POR_DIA;

  document.getElementById("amigaFoto").innerHTML =
    '<img src="' + imgDaAmiga() + '" alt="' + amigaDela() + '">';
  document.getElementById("amigaOi").textContent = "Oi, " + nomeDela() + "!";
  document.getElementById("amigaTarefa").textContent = feito
    ? "Missão de hoje cumprida!"
    : "Faltam " + (DESAFIOS_POR_DIA - m.feitos) + " brincadeiras hoje";
  document.getElementById("fitaAqui").innerHTML = fitaDaMissao();
  document.getElementById("recepcao").style.display = "flex";
}

if(temPerfil()) mostraRecepcao(); else abreApresentacao();

/* a amiga fala no primeiro toque da tela — antes disso o celular
   não deixa sair som nenhum */
let jaSaudou = false;
addEventListener("pointerdown", () => {
  if(jaSaudou || !temPerfil()) return;
  jaSaudou = true;
  const m = missao();
  if(typeof fala !== "function") return;
  fala(m.feitos >= DESAFIOS_POR_DIA
    ? "Oi " + nomeDela() + "! Você já fez tudo hoje. Quer brincar mais?"
    : "Oi " + nomeDela() + "! Faltam " + (DESAFIOS_POR_DIA - m.feitos) + " brincadeiras para terminar a missão de hoje.");
}, { once:false });

/* o menu mostra quantas ela já tem — o progresso fica visível na abertura */
try{
  const q = document.getElementById("quantasTenho");
  if(q && typeof quantasTem === "function") q.textContent = quantasTem() + " de " + totalDoAlbum() + " pôneis";
}catch(e){}

document.querySelectorAll(".jogo").forEach(b => {
  b.addEventListener("click", () => {
    const destino = b.dataset.pagina;
    let espera = 0;

    // o toque é real, então é aqui que o áudio do celular destrava.
    // se falhar, segue mesmo assim: abrir o jogo é mais importante que a voz.
    if(TEM_VOZJS){
      try{
        somToque();
        fala(b.dataset.fala);
        espera = 900;   // dá tempo da frase começar antes de trocar de página
      }catch(e){
        espera = 0;
      }
    }

    setTimeout(() => { location.href = destino; }, espera);
  });
});
</script>
</body>
</html>
