<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Monta a Pônei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MONTA A PÔNEI — quebra-cabeça

   Cada peça é a mesma foto com o enquadramento deslocado por CSS.
   Nenhum recorte é gerado, nenhuma imagem nova entra na pasta.

   POR QUE ESTA PÁGINA NÃO DEPENDE DE NADA:
   as duas versões anteriores travaram numa tela de espera. A causa
   não foi o quebra-cabeça em si, foi o que eu pendurei em volta —
   esperar a imagem confirmar antes de montar, e fazer isso dentro de
   uma função async, onde o erro vira rejeição silenciosa e nem o
   aviso de falha aparece.

   Aqui a lista de pôneis está escrita nesta página, o tabuleiro é
   montado de imediato, e album.js/personagens.js são usados só se
   existirem: para preferir uma pônei que ela já ganhou, e para
   entregar o prêmio no fim. Faltando os dois, o jogo funciona igual.

   Cada lugar vazio mostra a própria peça bem apagada, como sombra.
   Aos 4 anos é isso que torna o quebra-cabeça possível: ela compara
   em vez de imaginar. Peça no lugar errado só faz o lugar balançar.
   ============================================================ */
:root{ --roxo:#6B3FBF; --rosa:#FF6FB0; --amarelo:#FFD34A; }
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  font-family:'Baloo 2','Segoe UI Rounded',system-ui,sans-serif;
  color:#40276E; user-select:none; touch-action:manipulation; overflow:hidden;
}
#app{
  height:100dvh; display:flex; flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));
  max-width:560px; margin:0 auto;
}
.hud{ display:flex; align-items:center; gap:8px; min-height:44px; }
.btn-icone{
  width:44px; height:44px; border:0; border-radius:999px;
  background:rgba(255,255,255,.78); font-size:20px; cursor:pointer;
  box-shadow:0 2px 0 rgba(62,42,92,.12);
}
.btn-icone:active{ transform:translateY(2px); box-shadow:none; }
.balao{
  margin-left:auto; background:#fff; border-radius:20px; padding:9px 16px;
  font-weight:800; font-size:clamp(15px,4.6vw,20px);
  box-shadow:0 4px 0 rgba(62,42,92,.10);
}
.balao b{ color:#D2439A; }
.versao{ font-size:10px; font-weight:600; color:#B0A0CC; margin-left:6px; }

#recado{
  margin-top:8px; padding:10px 13px; border-radius:14px;
  background:#3B1220; color:#FFE6EE; border:2px solid var(--rosa);
  font-size:12.5px; line-height:1.5; cursor:pointer; word-break:break-word;
}
#recado.escondida{ display:none; }

#tabuleiro{
  flex:0 0 auto; width:min(78vw, 300px); margin:10px auto 0;
  aspect-ratio:1; display:grid; gap:3px;
  padding:6px; border-radius:22px; background:rgba(255,255,255,.5);
  box-shadow:inset 0 2px 8px rgba(107,63,191,.18), 0 6px 16px rgba(107,63,191,.2);
}
.lugar{
  position:relative; border-radius:8px; overflow:hidden;
  background:#F0E8FA; transition:transform .2s ease;
}
/* a sombra é um elemento de verdade, com o recorte escrito nele:
   'background:inherit' em pseudo-elemento não é confiável entre
   navegadores, e tabuleiro invisível é igual a tabuleiro que não
   nasceu */
.lugar .sombra{
  position:absolute; inset:0; background-repeat:no-repeat;
  opacity:.17; filter:grayscale(.55);
  transition:opacity .3s ease, filter .3s ease;
}
.lugar.cheio .sombra{ opacity:1; filter:none; }
.lugar.cheio{ animation:encaixa .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes encaixa{ 0%{transform:scale(1.3)} 60%{transform:scale(.95)} 100%{transform:scale(1)} }
.lugar.recusa{ animation:naoEai .4s ease; }
@keyframes naoEai{
  0%,100%{ transform:translateX(0); }
  30%{ transform:translateX(-7px) rotate(-3deg); }
  70%{ transform:translateX(7px) rotate(3deg); }
}

#pecas{
  flex:1; min-height:0; margin-top:12px;
  display:flex; flex-wrap:wrap; align-content:center; justify-content:center;
  gap:8px; padding:8px;
}
.peca{
  width:clamp(52px, 17vw, 76px); aspect-ratio:1;
  border:0; padding:0; cursor:pointer;
  border-radius:12px; background-repeat:no-repeat; background-color:#fff;
  box-shadow:0 0 0 3px #fff, 0 4px 10px rgba(62,42,92,.3);
  animation:balanca 3s ease-in-out infinite;
  transition:transform .2s ease, box-shadow .2s ease;
}
.peca:nth-child(2n){ animation-delay:.4s; }
.peca:nth-child(3n){ animation-delay:.9s; }
@keyframes balanca{
  0%,100%{ transform:translateY(0) rotate(-2deg); }
  50%{ transform:translateY(-5px) rotate(2deg); }
}
.peca.escolhida{
  animation:none; transform:scale(1.14);
  box-shadow:0 0 0 4px var(--amarelo), 0 0 20px rgba(255,201,60,.9);
}

#pronto{
  position:fixed; inset:0; z-index:200; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  padding:24px; text-align:center;
  background:radial-gradient(circle at 50% 40%, #FFF9DC 0%, #FFE9F4 55%, #EFE0FF 100%);
}
#pronto.visivel{ display:flex; }
#pronto .moldura{
  width:min(62vw,240px); aspect-ratio:1; border-radius:50%;
  overflow:hidden; border:6px solid var(--amarelo); background:#fff;
  box-shadow:0 12px 34px rgba(107,63,191,.3);
  animation:prontoEntra .6s cubic-bezier(.2,1.5,.4,1) both;
}
#pronto .moldura img{ width:100%; height:100%; object-fit:cover; object-position:center 30%; }
@keyframes prontoEntra{
  0%{ transform:scale(.3) rotate(-16deg); opacity:0; }
  100%{ transform:scale(1) rotate(0); opacity:1; }
}
#pronto .nome{ font-size:clamp(26px,8vw,40px); font-weight:800; color:var(--roxo); text-shadow:0 3px 0 #fff; }

.faisca{
  position:fixed; pointer-events:none; font-size:24px; z-index:210;
  animation:faiscaSobe 1.4s ease-out forwards;
}
@keyframes faiscaSobe{
  0%{ transform:translate(0,0) scale(.5); opacity:1; }
  100%{ transform:translate(var(--dx,0), var(--dy,-120px)) scale(1.2); opacity:0; }
}
</style>
<link rel="stylesheet" href="cenario.css">
</head>
<body>
<div class="cenario-chao"></div>
<div class="cenario-brilho" style="left:8%;  top:30%; animation-delay:0s">✨</div>
<div class="cenario-brilho" style="left:86%; top:44%; animation-delay:1.6s">⭐</div>
<div class="cenario-brilho" style="left:20%; top:68%; animation-delay:3.1s">✨</div>

<div id="app">
  <div class="hud">
    <button class="btn-icone" id="btnCasa" aria-label="Voltar ao mapa">🏠</button>
    <div class="balao">Monta <b id="quem">…</b>!<span class="versao" id="versao"></span></div>
  </div>

  <div id="recado" class="escondida"></div>
  <div id="tabuleiro"></div>
  <div id="pecas"></div>
</div>

<div id="pronto">
  <div class="moldura" id="prontoFoto"></div>
  <div class="nome" id="prontoNome"></div>
</div>

<script>
/* ===================================================================
   O JOGO. Roda antes de qualquer outro script, e não precisa de
   nenhum deles. Se o album.js entrar depois, melhor: o prêmio sai e
   a fase avança. Se não entrar, o quebra-cabeça funciona do mesmo
   jeito e o botão de casa volta ao mapa.
   =================================================================== */
(function(){
  var VERSAO = 'v4';

  /* Escrita aqui de propósito. Depender do album.js para saber QUAIS
     pôneis existem foi o que deixou a tela em branco duas vezes.
     Todas conferidas: têm arquivo .png na pasta imagens/. */
  var PONEIS_QC = [
    'Rarity', 'Princesa Celestia', 'Princesa Cadance', 'Apple Bloom',
    'Sweetie Belle', 'Scootaloo', 'Trixie', 'Diamond Tiara',
    'Silver Spoon', 'Cheerilee', 'Lyra Heartstrings', 'Octavia Melody',
    'DJ Pon-3', 'Coco Pommel', 'Sunburst', 'Gilda',
    'Big McIntosh', 'Babs Seed', 'Twist', 'Pipsqueak'
  ];

  var $ = function(id){ return document.getElementById(id); };
  var caminho = function(n){ return 'imagens/' + encodeURIComponent(n) + '.png'; };

  function avisa(txt){
    var r = $('recado');
    if(!r) return;
    r.textContent = txt;
    r.classList.remove('escondida');
  }
  $('recado').addEventListener('click', function(){ $('recado').classList.add('escondida'); });
  window.addEventListener('error', function(e){
    avisa('Erro: ' + e.message + (e.lineno ? ' (linha ' + e.lineno + ')' : ''));
  });

  /* o carimbo diz qual versão está no ar: duas correções minhas já
     foram engolidas por cache sem ninguém perceber */
  $('versao').textContent = VERSAO;
  $('btnCasa').addEventListener('click', function(){ location.href = 'index.html'; });

  /* De preferência uma que ela já ganhou — montar alguém que é dela
     vale mais. Mas só se o album.js estiver ali; nunca dependendo. */
  var pool = PONEIS_QC;
  try{
    if(typeof colecao === 'function'){
      var minhas = colecao().filter(function(n){ return PONEIS_QC.indexOf(n) >= 0; });
      if(minhas.length >= 3) pool = minhas;
    }
  }catch(e){}

  var ponei = pool[Math.floor(Math.random() * pool.length)];
  var foto  = caminho(ponei);

  /* cresce com o que ela venceu, não com o relógio */
  var col = 2, lin = 2;
  try{
    if(typeof vitorias === 'function'){
      var v = vitorias();
      if(v >= 4)  { col = 3; lin = 2; }
      if(v >= 12) { col = 3; lin = 3; }
    }
  }catch(e){}
  var TOTAL = col * lin;

  function recorte(i){
    var c = i % col, l = Math.floor(i / col);
    return {
      size: (col * 100) + '% ' + (lin * 100) + '%',
      pos:  (col > 1 ? (c / (col - 1)) * 100 : 0) + '% ' +
            (lin > 1 ? (l / (lin - 1)) * 100 : 0) + '%'
    };
  }

  var escolhida = null, postas = 0;

  $('quem').textContent = ponei;

  var tab = $('tabuleiro');
  tab.style.gridTemplateColumns = 'repeat(' + col + ', 1fr)';
  tab.style.gridTemplateRows    = 'repeat(' + lin + ', 1fr)';

  for(var i = 0; i < TOTAL; i++){
    (function(i){
      var r = recorte(i);
      var d = document.createElement('div');
      d.className = 'lugar';
      d.setAttribute('data-i', i);

      var s = document.createElement('div');
      s.className = 'sombra';
      s.style.backgroundImage    = 'url("' + foto + '")';
      s.style.backgroundSize     = r.size;
      s.style.backgroundPosition = r.pos;
      d.appendChild(s);

      d.addEventListener('click', function(){ encaixa(d); });
      tab.appendChild(d);
    })(i);
  }

  var ordem = [];
  for(var k = 0; k < TOTAL; k++) ordem.push(k);
  ordem.sort(function(){ return Math.random() - 0.5; });

  var caixa = $('pecas');
  ordem.forEach(function(i){
    var r = recorte(i);
    var b = document.createElement('button');
    b.className = 'peca';
    b.setAttribute('data-i', i);
    b.setAttribute('aria-label', 'Peça ' + (i + 1));
    b.style.backgroundImage    = 'url("' + foto + '")';
    b.style.backgroundSize     = r.size;
    b.style.backgroundPosition = r.pos;
    b.addEventListener('click', function(){ escolhe(b); });
    caixa.appendChild(b);
  });

  /* A imagem é conferida DEPOIS, com o jogo já na tela. Se o arquivo
     não vier, o aviso aparece e o tabuleiro continua ali — nunca uma
     tela de espera sem fim. */
  var teste = new Image();
  teste.onerror = function(){
    avisa('A imagem de ' + ponei + ' não carregou (' + foto + '). O jogo está montado, mas sem figura.');
  };
  teste.src = foto;

  function escolhe(b){
    if(escolhida === b){ b.classList.remove('escolhida'); escolhida = null; return; }
    if(escolhida) escolhida.classList.remove('escolhida');
    escolhida = b;
    b.classList.add('escolhida');
    if(typeof somToque === 'function'){ try{ somToque(); }catch(e){} }
  }

  function encaixa(lugar){
    if(!escolhida || lugar.className.indexOf('cheio') >= 0) return;

    /* lugar errado não tira nada dela: balança e a peça continua
       escolhida, pronta para a próxima tentativa */
    if(lugar.getAttribute('data-i') !== escolhida.getAttribute('data-i')){
      lugar.classList.remove('recusa');
      void lugar.offsetWidth;
      lugar.classList.add('recusa');
      if(typeof somErrou === 'function'){ try{ somErrou(); }catch(e){} }
      return;
    }

    lugar.classList.add('cheio');
    escolhida.parentNode.removeChild(escolhida);
    escolhida = null;
    postas++;
    if(typeof somAchou === 'function'){ try{ somAchou(); }catch(e){} }
    faiscas(lugar);

    if(postas === TOTAL) setTimeout(terminou, 600);
  }

  function faiscas(alvo){
    var r = alvo.getBoundingClientRect();
    var s = ['✨','⭐','💖'];
    for(var i = 0; i < 6; i++){
      (function(i){
        var f = document.createElement('div');
        f.className = 'faisca';
        f.textContent = s[i % 3];
        f.style.left = (r.left + r.width / 2) + 'px';
        f.style.top  = (r.top + r.height / 2) + 'px';
        f.style.setProperty('--dx', (Math.random() * 120 - 60).toFixed(0) + 'px');
        f.style.setProperty('--dy', (-40 - Math.random() * 90).toFixed(0) + 'px');
        document.body.appendChild(f);
        setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 1500);
      })(i);
    }
  }

  /* Fim de fase: mostra a pônei inteira e chama premiar(), se existir.
     Daí em diante quem conduz é o album.js — prêmio, contagem de
     vitória e volta ao mapa. Sem ele, volta ao mapa direto. */
  function terminou(){
    $('prontoFoto').innerHTML = '<img src="' + foto + '" alt="">';
    $('prontoNome').textContent = ponei;
    $('pronto').classList.add('visivel');
    if(typeof somVitoria === 'function'){ try{ somVitoria(); }catch(e){} }

    setTimeout(function(){
      $('pronto').classList.remove('visivel');
      if(typeof premiar === 'function') premiar();
      else location.href = 'index.html';
    }, 1900);
  }
})();
</script>

<!-- carregados DEPOIS: o jogo já está na tela quando eles chegam, e
     nenhum deles é necessário para ele funcionar -->
<script src="frases.js"></script>
<script src="perfil.js"></script>
<script src="album.js"></script>
