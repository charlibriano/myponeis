<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Monta a Pônei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MONTA A PÔNEI — quebra-cabeça

   A imagem é uma foto da série, cortada por CSS: cada peça é o mesmo
   arquivo com o enquadramento deslocado. Nenhum recorte é gerado,
   nenhuma imagem nova entra na pasta.

   A PRIMEIRA VERSÃO MONTAVA O TABULEIRO ANTES DE SABER SE A IMAGEM
   EXISTIA. Quando o arquivo não vinha — nome com acento, extensão
   .jpg, pônei sem foto na pasta — as peças ficavam com fundo vazio e
   a tela ficava em branco, sem aviso nenhum. Agora a imagem é
   carregada primeiro; o tabuleiro só nasce depois que ela confirma
   que existe, e a falha aparece escrita na tela.

   Cada lugar vazio mostra a própria peça bem apagada, como sombra.
   Aos 4 anos é isso que torna o quebra-cabeça possível: ela compara
   em vez de imaginar. Peça no lugar errado só faz o lugar balançar.
   ============================================================ */
:root{
  --lilas:#EFE3FF; --rosa-claro:#FFE4F2;
  --roxo:#6B3FBF; --rosa:#FF6FB0; --amarelo:#FFD34A;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  font-family:'Baloo 2','Segoe UI Rounded',system-ui,sans-serif;
  color:#40276E; user-select:none; touch-action:manipulation; overflow:hidden;
}
#app{
  height:100dvh; display:flex; flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));
  max-width:560px; margin:0 auto;
}

.hud{ display:flex; align-items:center; gap:8px; min-height:44px; }
.btn-icone{
  width:44px; height:44px; border:0; border-radius:999px;
  background:rgba(255,255,255,.78); font-size:20px; cursor:pointer;
  box-shadow:0 2px 0 rgba(62,42,92,.12);
}
.btn-icone:active{ transform:translateY(2px); box-shadow:none; }
.balao{
  margin-left:auto; background:#fff; border-radius:20px; padding:9px 16px;
  font-weight:800; font-size:clamp(15px,4.6vw,20px);
  box-shadow:0 4px 0 rgba(62,42,92,.10);
}
.balao b{ color:#D2439A; }

#recado{
  margin-top:8px; padding:10px 13px; border-radius:14px;
  background:#3B1220; color:#FFE6EE; border:2px solid var(--rosa);
  font-size:12.5px; line-height:1.5; cursor:pointer; word-break:break-word;
}
#recado.escondida{ display:none; }

#carregando{
  flex:1; display:flex; align-items:center; justify-content:center;
  font-size:17px; font-weight:800; color:#8A6FBF;
}
#carregando.escondida{ display:none; }

/* ---------- o tabuleiro ---------- */
#tabuleiro{
  flex:0 0 auto; width:min(78vw, 300px); margin:10px auto 0;
  aspect-ratio:1; display:grid; gap:3px;
  padding:6px; border-radius:22px; background:rgba(255,255,255,.5);
  box-shadow:inset 0 2px 8px rgba(107,63,191,.18), 0 6px 16px rgba(107,63,191,.2);
}
#tabuleiro.escondida, #pecas.escondida{ display:none; }

.lugar{
  position:relative; border-radius:8px; overflow:hidden;
  background:#F0E8FA;
  transition:transform .2s ease;
}
/* a sombra da peça que falta ali. É um filho de verdade, com o
   recorte escrito nele — 'background:inherit' em pseudo-elemento não
   é confiável entre navegadores, e um tabuleiro invisível é
   indistinguível de um tabuleiro que não foi montado. */
.lugar .sombra{
  position:absolute; inset:0;
  background-repeat:no-repeat;
  opacity:.17; filter:grayscale(.55);
  transition:opacity .3s ease, filter .3s ease;
}
.lugar.cheio .sombra{ opacity:1; filter:none; }
.lugar.cheio{ animation:encaixa .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes encaixa{
  0%{ transform:scale(1.3); } 60%{ transform:scale(.95); } 100%{ transform:scale(1); }
}
.lugar.recusa{ animation:naoEai .4s ease; }
@keyframes naoEai{
  0%,100%{ transform:translateX(0); }
  30%    { transform:translateX(-7px) rotate(-3deg); }
  70%    { transform:translateX(7px)  rotate(3deg); }
}

/* ---------- as peças soltas ---------- */
#pecas{
  flex:1; min-height:0; margin-top:12px;
  display:flex; flex-wrap:wrap; align-content:center; justify-content:center;
  gap:8px; padding:8px;
}
.peca{
  width:clamp(52px, 17vw, 76px); aspect-ratio:1;
  border:0; padding:0; cursor:pointer;
  border-radius:12px; background-repeat:no-repeat; background-color:#fff;
  box-shadow:0 0 0 3px #fff, 0 4px 10px rgba(62,42,92,.3);
  animation:balanca 3s ease-in-out infinite;
  transition:transform .2s ease, box-shadow .2s ease;
}
.peca:nth-child(2n){ animation-delay:.4s; }
.peca:nth-child(3n){ animation-delay:.9s; }
@keyframes balanca{
  0%,100%{ transform:translateY(0)    rotate(-2deg); }
  50%    { transform:translateY(-5px) rotate(2deg); }
}
.peca.escolhida{
  animation:none; transform:scale(1.14);
  box-shadow:0 0 0 4px var(--amarelo), 0 0 20px rgba(255,201,60,.9);
}

/* ---------- a comemoração ---------- */
#pronto{
  position:fixed; inset:0; z-index:200; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  padding:24px; text-align:center;
  background:radial-gradient(circle at 50% 40%, #FFF9DC 0%, #FFE9F4 55%, #EFE0FF 100%);
}
#pronto.visivel{ display:flex; }
#pronto .moldura{
  width:min(62vw,240px); aspect-ratio:1; border-radius:50%;
  overflow:hidden; border:6px solid var(--amarelo); background:#fff;
  box-shadow:0 12px 34px rgba(107,63,191,.3);
  animation:prontoEntra .6s cubic-bezier(.2,1.5,.4,1) both;
}
#pronto .moldura img{ width:100%; height:100%; object-fit:cover; object-position:center 30%; }
@keyframes prontoEntra{
  0%{ transform:scale(.3) rotate(-16deg); opacity:0; }
  100%{ transform:scale(1) rotate(0); opacity:1; }
}
#pronto .nome{ font-size:clamp(26px,8vw,40px); font-weight:800; color:var(--roxo); text-shadow:0 3px 0 #fff; }

.faisca{
  position:fixed; pointer-events:none; font-size:24px; z-index:210;
  animation:faiscaSobe 1.4s ease-out forwards;
}
@keyframes faiscaSobe{
  0%  { transform:translate(0,0) scale(.5); opacity:1; }
  100%{ transform:translate(var(--dx,0), var(--dy,-120px)) scale(1.2); opacity:0; }
}
</style>
<link rel="stylesheet" href="cenario.css">
</head>
<body>
<div class="cenario-chao"></div>
<div class="cenario-brilho" style="left:8%;  top:30%; animation-delay:0s">✨</div>
<div class="cenario-brilho" style="left:86%; top:44%; animation-delay:1.6s">⭐</div>
<div class="cenario-brilho" style="left:20%; top:68%; animation-delay:3.1s">✨</div>

<div id="app">
  <div class="hud">
    <button class="btn-icone" id="btnCasa" aria-label="Voltar ao mapa">🏠</button>
    <div class="balao">Monta <b id="quem">…</b>!</div>
  </div>

  <div id="recado" class="escondida"></div>
  <div id="carregando">preparando…</div>

  <div id="tabuleiro" class="escondida"></div>
  <div id="pecas" class="escondida"></div>
</div>

<div id="pronto">
  <div class="moldura" id="prontoFoto"></div>
  <div class="nome" id="prontoNome"></div>
</div>

<script src="frases.js"></script>
<script src="voz.js"></script>
<script src="perfil.js"></script>
<script src="personagens.js"></script>
<script src="poneis.js"></script>
<script src="album.js"></script>
<script>
const $ = id => document.getElementById(id);

function avisa(txt){
  $('recado').textContent = txt;
  $('recado').classList.remove('escondida');
  $('carregando').classList.add('escondida');
}
$('recado').addEventListener('click', () => $('recado').classList.add('escondida'));

/* erro na tela, não no console */
addEventListener('error', e => {
  avisa('Erro: ' + e.message + (e.lineno ? ' (linha ' + e.lineno + ')' : ''));
});

$('btnCasa').addEventListener('click', () => { location.href = 'index.html'; });

/* ---------- de onde vêm as candidatas ----------
   Ordem de preferência: as que ela já ganhou (montar alguém que é
   dela vale mais), depois a lista do álbum, e por último o catálogo
   inteiro de personagens, que é o que sempre existe. */
function candidatas(){
  const lista = [];
  try{ if(typeof colecao === 'function') lista.push(...colecao()); }catch(e){}
  try{ if(typeof ALBUM !== 'undefined') lista.push(...ALBUM); }catch(e){}

  const nomes = [...new Set(lista)];
  const fila = nomes.map(n => ({
    nome: n,
    src: (typeof imgDoAlbum === 'function')
      ? imgDoAlbum(n) : 'imagens/' + encodeURIComponent(n) + '.png'
  }));

  /* o catálogo já traz o caminho certo de cada arquivo, inclusive os
     poucos que são .jpg — por isso ele é a rede de segurança */
  try{
    if(typeof PERSONAGENS !== 'undefined' && Array.isArray(PERSONAGENS)){
      PERSONAGENS.forEach(p => {
        if(p && p.nome && p.img) fila.push({ nome:p.nome, src:p.img });
      });
    }
  }catch(e){}

  return fila;
}

/* Verifica se o arquivo existe DE VERDADE. Sem callback nenhum de
   Promise: erro dentro de função async não dispara o
   addEventListener('error') da página — vira rejeição silenciosa, e
   foi exatamente isso que deixou a tela parada em "preparando…".
   Aqui tudo é callback simples, que o vigia consegue enxergar. */
function carrega(src, resposta){
  const img = new Image();
  img.onload  = () => resposta(img.naturalWidth > 0);
  img.onerror = () => resposta(false);
  img.src = src;
}

/* Monta com a primeira candidata NA HORA, sem esperar nada. Se a
   imagem não vier, troca pela seguinte e remonta. Assim a criança
   nunca fica olhando para uma tela vazia à espera de uma
   verificação: no pior caso ela vê o tabuleiro e um aviso. */
function tentaCandidata(fila, i, tentados){
  if(i >= fila.length || i >= 5){
    avisa('Nenhuma imagem carregou. Caminhos tentados: ' + tentados.join(' · '));
    return;
  }

  const c = fila[i];
  tentados.push(c.src);

  ponei = c.nome;
  foto  = c.src;
  const t = tamanho();
  col = t.col; lin = t.lin; TOTAL = col * lin;
  postas = 0; escolhida = null;
  monta();

  carrega(c.src, ok => {
    if(ok) return;                       // era boa: fica como está
    tentaCandidata(fila, i + 1, tentados);
  });
}

/* ---------- o tamanho do desafio ----------
   Cresce com o que ela já venceu, não com o relógio. */
function tamanho(){
  let v = 0;
  try{ if(typeof vitorias === 'function') v = vitorias(); }catch(e){}
  if(v < 4)  return { col:2, lin:2 };
  if(v < 12) return { col:3, lin:2 };
  return { col:3, lin:3 };
}

let foto = null, ponei = null, col = 2, lin = 2, TOTAL = 4;
let escolhida = null, postas = 0;

/* o recorte de cada peça: C colunas viram uma imagem C vezes maior,
   e cada peça mostra a sua fatia */
function recorte(i){
  const c = i % col, l = Math.floor(i / col);
  return {
    size: (col * 100) + '% ' + (lin * 100) + '%',
    pos:  (col > 1 ? (c / (col - 1)) * 100 : 0) + '% ' +
          (lin > 1 ? (l / (lin - 1)) * 100 : 0) + '%'
  };
}

function monta(){
  $('quem').textContent = ponei;
  $('carregando').classList.add('escondida');
  $('tabuleiro').classList.remove('escondida');
  $('pecas').classList.remove('escondida');

  const tab = $('tabuleiro');
  tab.innerHTML = '';
  tab.style.gridTemplateColumns = 'repeat(' + col + ', 1fr)';
  tab.style.gridTemplateRows    = 'repeat(' + lin + ', 1fr)';

  for(let i = 0; i < TOTAL; i++){
    const r = recorte(i);
    const d = document.createElement('div');
    d.className = 'lugar';
    d.dataset.i = i;

    const s = document.createElement('div');
    s.className = 'sombra';
    s.style.backgroundImage    = 'url("' + foto + '")';
    s.style.backgroundSize     = r.size;
    s.style.backgroundPosition = r.pos;
    d.appendChild(s);

    d.addEventListener('click', () => encaixa(d));
    tab.appendChild(d);
  }

  const caixa = $('pecas');
  caixa.innerHTML = '';
  [...Array(TOTAL).keys()].sort(() => Math.random() - .5).forEach(i => {
    const r = recorte(i);
    const b = document.createElement('button');
    b.className = 'peca';
    b.dataset.i = i;
    b.setAttribute('aria-label', 'Peça ' + (i + 1));
    b.style.backgroundImage    = 'url("' + foto + '")';
    b.style.backgroundSize     = r.size;
    b.style.backgroundPosition = r.pos;
    b.addEventListener('click', () => escolhe(b));
    caixa.appendChild(b);
  });
}

function escolhe(b){
  if(escolhida === b){ b.classList.remove('escolhida'); escolhida = null; return; }
  if(escolhida) escolhida.classList.remove('escolhida');
  escolhida = b;
  b.classList.add('escolhida');
  if(typeof somToque === 'function') try{ somToque(); }catch(e){}
}

function encaixa(lugar){
  if(!escolhida || lugar.classList.contains('cheio')) return;

  /* lugar errado não tira nada dela: balança e a peça continua
     escolhida, pronta para a próxima tentativa */
  if(lugar.dataset.i !== escolhida.dataset.i){
    lugar.classList.remove('recusa');
    void lugar.offsetWidth;
    lugar.classList.add('recusa');
    if(typeof somErrou === 'function') try{ somErrou(); }catch(e){}
    return;
  }

  lugar.classList.add('cheio');
  escolhida.remove();
  escolhida = null;
  postas++;
  if(typeof somAchou === 'function') try{ somAchou(); }catch(e){}
  faiscas(lugar);

  if(postas === TOTAL) setTimeout(terminou, 600);
}

function faiscas(alvo){
  const r = alvo.getBoundingClientRect();
  const s = ['✨','⭐','💖'];
  for(let i = 0; i < 6; i++){
    const f = document.createElement('div');
    f.className = 'faisca';
    f.textContent = s[i % 3];
    f.style.left = (r.left + r.width / 2) + 'px';
    f.style.top  = (r.top + r.height / 2) + 'px';
    f.style.setProperty('--dx', (Math.random() * 120 - 60).toFixed(0) + 'px');
    f.style.setProperty('--dy', (-40 - Math.random() * 90).toFixed(0) + 'px');
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1500);
  }
}

/* Fim de fase: mostra a pônei inteira e chama premiar(). Daí em
   diante quem conduz é o album.js — prêmio, contagem de vitória e
   volta ao mapa. Esta página não sabe que o mapa existe. */
function terminou(){
  $('prontoFoto').innerHTML = '<img src="' + foto + '" alt="">';
  $('prontoNome').textContent = ponei;
  $('pronto').classList.add('visivel');
  if(typeof somVitoria === 'function') try{ somVitoria(); }catch(e){}

  setTimeout(() => {
    $('pronto').classList.remove('visivel');
    if(typeof premiar === 'function') premiar();
    else location.href = 'index.html';
  }, 1900);
}

/* rejeição de Promise não passa pelo 'error': escutamos as duas */
addEventListener('unhandledrejection', e => {
  avisa('Falha silenciosa: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});

/* O VIGIA. Se em 3 segundos o tabuleiro não tiver nascido, a página
   conta na tela o que encontrou. Tela parada sem explicação é o pior
   resultado possível — pior que erro, porque não dá o que consertar. */
setTimeout(() => {
  if(document.querySelector('#tabuleiro .lugar')) return;
  avisa('O tabuleiro não montou. album.js: ' + (typeof colecao) +
        ' · ALBUM: ' + (typeof ALBUM) +
        ' · PERSONAGENS: ' + (typeof PERSONAGENS) +
        ' · candidatas: ' + (function(){ try{ return candidatas().length; }catch(e){ return 'erro: ' + e.message; } })() +
        ' · pônei: ' + ponei + ' · foto: ' + foto);
}, 3000);

(function comeca(){
  const fila = candidatas();
  if(!fila.length){
    avisa('Nenhuma pônei disponível: o album.js e o personagens.js carregaram?');
    return;
  }
  fila.sort(() => Math.random() - .5);
  tentaCandidata(fila, 0, []);
})();
</script>
</body>
</html>
